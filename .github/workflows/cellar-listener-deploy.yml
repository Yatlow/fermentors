name: Deploy Cellar Listener Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "cellar-listener/**"
      - ".github/workflows/cellar-listener-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cellar-listener-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Push cellar listener sources
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cellar-listener

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Missing GitHub Actions secret: CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Validate listener project
        run: |
          test -f .clasp.json
          test -f appsscript.json
          for file in *.js; do
            echo "Syntax check: $file"
            node --check "$file"
          done

      - name: Push Apps Script sources
        run: clasp push --force

      - name: Verify remote Apps Script contents
        run: |
          SCRIPT_ID=$(node -p "require('./.clasp.json').scriptId")
          rm -rf remote-verify
          mkdir remote-verify
          cd remote-verify
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json
          clasp pull
          grep -R "function setupCellarListenerService" .
          grep -R "function cellarSheetOnEdit" .
          echo "Remote listener project contains expected functions."

      - name: Update production web app deployment
        run: |
          DEPLOYMENT_ID=$(clasp deployments | awk '/^- / && $NF != "@HEAD" {print $2; exit}')
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "No versioned cellar-listener deployment found."
            exit 1
          fi
          echo "Updating production deployment: $DEPLOYMENT_ID"
          clasp deploy -i "$DEPLOYMENT_ID" -d "GitHub $GITHUB_SHA"

      - name: Verify production deployment
        run: |
          clasp deployments
          DEPLOYMENT_ID=$(clasp deployments | awk '/^- / && $NF != "@HEAD" {print $2; exit}')
          VERSION=$(clasp deployments | awk -v id="$DEPLOYMENT_ID" '$2 == id {print $3; exit}')
          if [ -z "$VERSION" ] || [ "$VERSION" = "@HEAD" ]; then
            echo "Production cellar-listener deployment was not versioned."
            exit 1
          fi
          echo "Production cellar-listener deployment is now $VERSION."
