name: Apply daily cellar action score fix

on:
  push:
    branches:
      - fix/daily-cellar-actions-score
    paths:
      - .github/workflows/apply-daily-cellar-action-score.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-cellar-actions-score
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply score patch
        run: python3 scripts/patch-daily-cellar-score.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit tested fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SERVICES/dashboard/healthModel.ts src/components/dashboard/HealthDashboard.tsx tests/health-dashboard-model.test.ts
          git diff --cached --check
          git commit -m 'Score pending daily cellar routine actions'
          git push origin HEAD:fix/daily-cellar-actions-score