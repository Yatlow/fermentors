name: Apply fermentation table view

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/apply-fermentation-table-view.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply view changes
        run: node .github/scripts/apply-fermentation-table-view.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/Batchhistorychart.tsx
          git commit -m "Add fermentation table as default history view"
          git push
