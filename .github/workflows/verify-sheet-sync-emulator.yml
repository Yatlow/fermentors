name: Verify Sheet Sync Firestore Emulator
on:
  pull_request:
    paths:
      - 'server/sheetSyncOutbox.js'
      - 'scripts/test-sheet-sync-firestore-emulator.mjs'
      - '.github/workflows/verify-sheet-sync-emulator.yml'
  workflow_dispatch:
jobs:
  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run recovery integration tests against isolated Firestore emulator
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project sheet-sync-integration-test "node --test scripts/test-sheet-sync-firestore-emulator.mjs"
