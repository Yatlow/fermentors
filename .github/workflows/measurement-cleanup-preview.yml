name: Preview Measurement Cleanup (Read Only)

on:
  workflow_dispatch:
    inputs:
      batches:
        description: "Comma-separated batch IDs, max 10 per run (no automatic historical scan)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: measurement-cleanup-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Authenticate (read-only operation)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FERMENTER_DASHBOARD_BADA3 }}
      - name: Run local regression test
        run: node scripts/preview-measurement-cleanup.mjs --self-test
      - name: Export duplicate values and conservative preview
        env:
          FIREBASE_PROJECT_ID: fermenter-dashboard-bada3
          BATCHES: ${{ inputs.batches }}
        run: |
          set -euo pipefail
          node scripts/preview-measurement-cleanup.mjs --batches "$BATCHES" > measurement-cleanup-preview.json
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const r=JSON.parse(fs.readFileSync("measurement-cleanup-preview.json","utf8"));
          const groups=r.results.flatMap(x=>x.duplicateGroups);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "## Read-only cleanup preview\n\n"+
            "- Batches: "+r.scannedBatches.join(", ")+"\n"+
            "- Measurement reads: "+r.documentsRead+"\n"+
            "- Duplicate groups: "+groups.length+"\n"+
            "- Identical content: "+groups.filter(x=>x.status==="IDENTICAL_CONTENT").length+"\n"+
            "- Manual review: "+groups.filter(x=>x.status!=="IDENTICAL_CONTENT").length+"\n"+
            "- Firestore writes/deletes: **0**\n\n"+
            "The short-lived artifact includes original values and metadata for duplicate groups only.\n");
          JS
      - name: Upload sensitive snapshot and preview
        uses: actions/upload-artifact@v4
        with:
          name: measurement-cleanup-preview-${{ github.run_number }}
          path: measurement-cleanup-preview.json
          retention-days: 3
