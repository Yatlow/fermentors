name: Apply PR119 targeted planning fix

on:
  push:
    branches: [planning-tank-schedule]
    paths: ['.github/workflows/pr119-performance-pass.yml']

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
      - run: python scripts/fix-pr119-brew-override-row.py
      - run: npm ci
      - name: Validate frontend and planning logic
        run: |
          npm run lint
          npm test -- --run
          npm run build
      - name: Verify and commit targeted fix
        run: |
          git diff --check
          git diff -- src/components/planning/PlanningWeeklyRecommendations.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/planning/PlanningWeeklyRecommendations.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Keep unavailable tank override on exceptional brew row'
          git push origin HEAD:planning-tank-schedule
