name: Disable automatic brew date

on:
  push:
    branches: [fix/disable-auto-brew-date]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/disable-auto-brew-date
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/patch-disable-auto-brew-date.py
      - run: |
          npm ci
          npm run lint
          npm test
          npm run build
          cd server
          for file in *.js; do node --check "$file"; done
          cd ..
          node .github/scripts/validate-apps-script-runtime.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/disable-auto-brew-date.yml
          rm scripts/patch-disable-auto-brew-date.py
          git add -A
          git commit -m "Fix variable brew rows and volume-driven ACTION 0 transition"
          git push origin HEAD:fix/disable-auto-brew-date
