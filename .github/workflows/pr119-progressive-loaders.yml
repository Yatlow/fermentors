name: Apply PR119 progressive loaders

on:
  push:
    branches: [planning-tank-schedule]
    paths: ['.github/workflows/pr119-progressive-loaders.yml']

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
      - run: python scripts/patch-pr119-progressive-loaders.py
      - run: npm ci
      - name: Validate progressive planning UI
        run: |
          npm run lint
          npm test -- --run
          npm run build
          git diff --check
      - name: Commit targeted Gantt change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/planning/PlanningGantt.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Show progressive loaders while planning weeks calculate'
          git push origin HEAD:planning-tank-schedule
