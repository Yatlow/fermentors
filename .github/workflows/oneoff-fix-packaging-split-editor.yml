name: One-off fix packaging split editor

on:
  push:
    branches:
      - fix/planning-early-packaging-regressions
    paths:
      - '.github/workflows/oneoff-fix-packaging-split-editor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-early-packaging-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply packaging split patch
        run: python scripts/patch-packaging-split.py
      - name: Verify
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit product change and clean helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-fix-packaging-split-editor.yml scripts/patch-packaging-split.py
          git add src/components/planning/PlanningWeeklyRecommendations.tsx
          git commit -m 'Fix split packaging remainder editing'
          git push origin HEAD:fix/planning-early-packaging-regressions
