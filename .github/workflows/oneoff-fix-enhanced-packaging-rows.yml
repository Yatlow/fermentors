name: One-off fix enhanced packaging rows

on:
  push:
    branches:
      - fix/planning-early-packaging-regressions
    paths:
      - '.github/workflows/oneoff-fix-enhanced-packaging-rows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-early-packaging-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch enhanced packaging row state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/planning/PlanningWeeklyRecommendationsEnhanced.tsx')
          text = path.read_text()

          old = '''    function addManualRow() {
        if (!packStyle) return;
        const recommended = model.packagingRecommendation.find((rec) => {
            const p = product(rec.productId);
            return p && sameStyle(p.style, packStyle) && recommendationRemaining(rec) > 0;
        });
        if (recommended) {
            setRows((currentRows) => [...currentRows, {
                key: `rec:${recommended.id}`,
                source: "recommendation",
                tankId: recommended.tankId,
                productId: recommended.productId,
                quantity: recommendationRemaining(recommended, currentRows),
                completed: 0,
            }]);
            return;
        }
        const products = styleProducts(packStyle);
        const styleTanks = tanksForStyle(packStyle);
        const defaultProduct = products[0];
        const defaultTank = styleTanks[0];
        const key = `manual:${crypto.randomUUID()}`;
        setRows((currentRows) => {
            const quantity = defaultProduct && defaultTank
                ? defaultQuantityForSelection(defaultProduct.id, defaultTank.id, currentRows, key, 0)
                : 0;
            return [...currentRows, {
                key,
                source: "manual",
                tankId: defaultTank?.id ?? "",
                productId: defaultProduct?.id ?? "",
                quantity,
                completed: 0,
            }];
        });
    }
'''

          new = '''    function addManualRow() {
        if (!packStyle) return;
        const products = styleProducts(packStyle);
        const styleTanks = tanksForStyle(packStyle);
        const key = `manual:${crypto.randomUUID()}`;

        setRows((currentRows) => {
            // "Add packaging" is always a genuinely independent row. Prefer the
            // same tank that is already being split, then the opposite package
            // type, and calculate this new row from the liters still unallocated
            // in that tank. Never reuse a recommendation key: duplicate keys made
            // two visible rows share the same update/remove state.
            const splitSource = [...currentRows].reverse().find((row) => row.tankId);
            const defaultTank = splitSource
                ? styleTanks.find((tank) => tank.id === splitSource.tankId) ?? styleTanks[0]
                : styleTanks[0];
            const sourceProduct = splitSource ? product(splitSource.productId) : undefined;
            const defaultProduct = sourceProduct
                ? products.find((item) => item.type !== sourceProduct.type) ?? products[0]
                : products[0];
            const quantity = defaultProduct && defaultTank
                ? defaultQuantityForSelection(defaultProduct.id, defaultTank.id, currentRows, key, 0)
                : 0;

            return [...currentRows, {
                key,
                source: "manual",
                tankId: defaultTank?.id ?? "",
                productId: defaultProduct?.id ?? "",
                quantity,
                completed: 0,
            }];
        });
    }
'''

          if old not in text:
              raise SystemExit('addManualRow marker not found')
          text = text.replace(old, new, 1)

          old = '''            return [...currentRows, {
                key: `rec:${rec.id}`,
                source: "recommendation",
'''
          new = '''            return [...currentRows, {
                key: `rec:${rec.id}:${crypto.randomUUID()}`,
                source: "recommendation",
'''
          if old not in text:
              raise SystemExit('addRecommendation key marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-fix-enhanced-packaging-rows.yml
          git add src/components/planning/PlanningWeeklyRecommendationsEnhanced.tsx
          git commit -m 'Fix independent packaging split rows'
          git push origin HEAD:fix/planning-early-packaging-regressions
