# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

concurrency:
  group: firebase-hosting-production
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create deployed version marker
        run: printf '{"version":"%s"}\n' "$GITHUB_SHA" > public/app-version.json

      - name: Verify and build
        run: npm ci && npm test && npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FERMENTER_DASHBOARD_BADA3 }}
          channelId: live
          projectId: fermenter-dashboard-bada3
