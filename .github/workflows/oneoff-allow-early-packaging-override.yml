name: One-off allow early packaging override

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/scripts/oneoff_early_packaging_override.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SERVICES/planning/productionCycle.ts src/components/planning/PlanningBoard.tsx
          git commit -m 'Allow authorized early packaging override'
          git push origin HEAD:main
