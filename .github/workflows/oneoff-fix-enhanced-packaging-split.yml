name: One-off fix enhanced packaging split

on:
  push:
    branches:
      - fix/planning-early-packaging-regressions
    paths:
      - '.github/workflows/oneoff-fix-enhanced-packaging-split.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-early-packaging-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch enhanced packaging split editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/planning/PlanningWeeklyRecommendationsEnhanced.tsx')
          text = path.read_text()

          old = '''    function addManualRow() {
        if (!packStyle) return;
        const recommended = model.packagingRecommendation.find((rec) => {
            const p = product(rec.productId);
            return p && sameStyle(p.style, packStyle) && recommendationRemaining(rec) > 0;
        });
        if (recommended) {
            setRows((currentRows) => [...currentRows, {
                key: `rec:${recommended.id}`,
                source: "recommendation",
                tankId: recommended.tankId,
                productId: recommended.productId,
                quantity: recommendationRemaining(recommended, currentRows),
                completed: 0,
            }]);
            return;
        }
        const products = styleProducts(packStyle);
        const styleTanks = tanksForStyle(packStyle);
        const defaultProduct = products[0];
        const defaultTank = styleTanks[0];
        const key = `manual:${crypto.randomUUID()}`;
        setRows((currentRows) => {
            const quantity = defaultProduct && defaultTank
                ? defaultQuantityForSelection(defaultProduct.id, defaultTank.id, currentRows, key, 0)
                : 0;
            return [...currentRows, {
                key,
                source: "manual",
                tankId: defaultTank?.id ?? "",
                productId: defaultProduct?.id ?? "",
                quantity,
                completed: 0,
            }];
        });
    }
'''

          new = '''    function addManualRow() {
        if (!packStyle) return;
        const styleItems = styleProducts(packStyle);
        const styleTanks = tanksForStyle(packStyle);
        const key = `manual:${crypto.randomUUID()}`;
        setRows((currentRows) => {
            const previous = currentRows[currentRows.length - 1];
            const previousProduct = previous ? product(previous.productId) : undefined;
            const defaultTank = previous?.tankId
                ? styleTanks.find((tank) => tank.id === previous.tankId) ?? styleTanks[0]
                : styleTanks[0];
            const defaultProduct = previousProduct
                ? styleItems.find((item) => item.type !== previousProduct.type) ?? styleItems[0]
                : styleItems[0];
            const quantity = defaultProduct && defaultTank
                ? defaultQuantityForSelection(defaultProduct.id, defaultTank.id, currentRows, key, 0)
                : 0;
            return [...currentRows, {
                key,
                source: "manual",
                tankId: defaultTank?.id ?? "",
                productId: defaultProduct?.id ?? "",
                quantity,
                completed: 0,
            }];
        });
    }
'''

          if old not in text:
              raise SystemExit('addManualRow marker not found')
          text = text.replace(old, new, 1)

          old = '''    function updateRow(key: string, patch: Partial<PackRow>) {
        setRows((currentRows) => currentRows.map((row) => {
            if (row.key !== key) return row;
            const next = { ...row, ...patch };
            if (patch.tankId !== undefined || patch.productId !== undefined) {
                const max = defaultQuantityForSelection(next.productId, next.tankId, currentRows, key, next.completed);
                next.quantity = Math.max(next.completed, Math.min(next.quantity, max));
            }
            return next;
        }));
    }
'''

          new = '''    function updateRow(key: string, patch: Partial<PackRow>) {
        setRows((currentRows) => currentRows.map((row) => {
            if (row.key !== key) return row;
            const next = { ...row, ...patch };
            if (patch.tankId !== undefined || patch.productId !== undefined) {
                const max = defaultQuantityForSelection(next.productId, next.tankId, currentRows, key, next.completed);
                // Manual split rows are independent state. Selecting their tank or
                // package type fills THIS row from the remaining tank volume once;
                // subsequent quantity edits never mutate sibling rows.
                next.quantity = row.source === "manual"
                    ? max
                    : Math.max(next.completed, Math.min(next.quantity, max));
            }
            return next;
        }));
    }
'''

          if old not in text:
              raise SystemExit('updateRow marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-fix-enhanced-packaging-split.yml
          git add src/components/planning/PlanningWeeklyRecommendationsEnhanced.tsx
          git commit -m 'Restore independent packaging split remainder behavior'
          git push origin HEAD:fix/planning-early-packaging-regressions
