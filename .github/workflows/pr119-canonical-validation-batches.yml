name: Apply PR119 stage0 relink and canonical packaging fix
on:
  workflow_dispatch:
  push:
    branches: [planning-tank-schedule]
    paths: ['.github/workflows/pr119-canonical-validation-batches.yml']
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply targeted fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Existing-brew relinking is only for real brews still waiting to be brewed
          # (stage 0 / action 0). Active/fermenting historical batches are not valid
          # candidates for reconnecting a rebuilt future plan.
          p = Path('src/components/planning/PlanningBrewAssignmentEditor.tsx')
          s = p.read_text()
          old = '''                {existingBrews
                  .filter((existing) => existing.beerStyle.trim().toLowerCase() === selectedBrew.style.trim().toLowerCase())
                  .map((existing) => <option key={existing.id} value={existing.id}>#{existing.batchNumber} · {displayStyle(existing.beerStyle)} · מיכל {existing.tankNumber || "—"}</option>)}'''
          new = '''                {existingBrews
                  .filter((existing) => existing.beerStyle.trim().toLowerCase() === selectedBrew.style.trim().toLowerCase())
                  .filter((existing) => brews.some((source) =>
                    Number(source.action) === 0 &&
                    normalizedBatch(source.batchNumber) === normalizedBatch(existing.batchNumber)
                  ))
                  .map((existing) => <option key={existing.id} value={existing.id}>#{existing.batchNumber} · {displayStyle(existing.beerStyle)} · מיכל {existing.tankNumber || "—"}</option>)}'''
          if old not in s:
              raise SystemExit('Stage-0 relink options anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) A canonical future packaging row is linked to a planned brew cycle.
          # That cycle may target a tank which is currently empty and therefore absent
          # from the physical Tank[] snapshot. Do not require a current physical Tank
          # record for canonical future cycles; projection + linked brew are the truth.
          p = Path('src/SERVICES/planning/productionCycle.ts')
          s = p.read_text()
          old = '''    const t = tanks.find((t) => t.id === tankId);
    const p = settings.products.find((p) => p.id === r.productId);
    const runType = r.nonInventoryType ?? p?.type;
    if (!t) return "חסר מיכל מקור לאריזה";

    const projectedCycle = linkedBrewId
      ? projectTankSchedules(plans, settings).get(tankId)?.find((cycle) => cycle.cycleId === linkedBrewId)
      : null;
    const readyDate = projectedCycle?.readyDate ?? t.ready;
    if (r.date < readyDate && !r.earlyPackagingOverride && !options?.allowEarlyPackaging)
      return `מיכל ${t.number}: האריזה שובצה ל-${r.date} לפני מועד ההבשלה ${readyDate}`;'''
          new = '''    const t = tanks.find((t) => t.id === tankId);
    const p = settings.products.find((p) => p.id === r.productId);
    const runType = r.nonInventoryType ?? p?.type;
    // Legacy tank-only packaging still needs a physical Tank snapshot. A canonical
    // future brew does not: the planned brew + projected tank cycle are authoritative.
    if (!linkedBrew && !t) return "חסר מיכל מקור לאריזה";

    const projectedCycle = linkedBrewId
      ? projectTankSchedules(plans, settings).get(tankId)?.find((cycle) => cycle.cycleId === linkedBrewId)
      : null;
    const readyDate = projectedCycle?.readyDate ?? t?.ready;
    const tankLabel = t?.number ?? linkedBrew?.tankId ?? tankId;
    if (readyDate && r.date < readyDate && !r.earlyPackagingOverride && !options?.allowEarlyPackaging)
      return `מיכל ${tankLabel}: האריזה שובצה ל-${r.date} לפני מועד ההבשלה ${readyDate}`;'''
          if old not in s:
              raise SystemExit('Canonical packaging tank guard anchor not found')
          s = s.replace(old, new, 1)

          old = '''    const allowExceptions = plans.find((w) => w.id === r.week)?.allowExceptions;
    if (!allowExceptions && dates.length > 1 && types.size < 2)
      return `מיכל ${t.number}: פיצול לימים שונים מותר רק בין בקבוקים לחביות`;
    if (!allowExceptions && dates.length > 2)
      return `מיכל ${t.number}: ניתן לפצל לכל היותר לשני ימי אריזה`;

    const unitLiters = p ? litersPerUnit(p) : runType === "crates" ? 24 * 0.33 : 20;
    used.set(cycleKey, (used.get(cycleKey) ?? 0) + r.remaining * unitLiters);
    const cycleLiters = linkedBrew?.liters ?? t.liters;
    if (used.get(cycleKey)! > cycleLiters + 0.01)
      return `מיכל ${t.number}: הכמות המתוכננת גדולה מהנפח הזמין במחזור`;
    if (r.emptyTank && cycleLiters - used.get(cycleKey)! >= 20)
      return `מיכל ${t.number}: לא ניתן לסמן סיום — נשארת כמות שניתנת לאריזה מהמחזור`;'''
          new = '''    const allowExceptions = plans.find((w) => w.id === r.week)?.allowExceptions;
    if (!allowExceptions && dates.length > 1 && types.size < 2)
      return `מיכל ${tankLabel}: פיצול לימים שונים מותר רק בין בקבוקים לחביות`;
    if (!allowExceptions && dates.length > 2)
      return `מיכל ${tankLabel}: ניתן לפצל לכל היותר לשני ימי אריזה`;

    const unitLiters = p ? litersPerUnit(p) : runType === "crates" ? 24 * 0.33 : 20;
    used.set(cycleKey, (used.get(cycleKey) ?? 0) + r.remaining * unitLiters);
    const cycleLiters = linkedBrew?.liters ?? t?.liters ?? 0;
    if (cycleLiters > 0 && used.get(cycleKey)! > cycleLiters + 0.01)
      return `מיכל ${tankLabel}: הכמות המתוכננת גדולה מהנפח הזמין במחזור`;
    if (cycleLiters > 0 && r.emptyTank && cycleLiters - used.get(cycleKey)! >= 20)
      return `מיכל ${tankLabel}: לא ניתן לסמן סיום — נשארת כמות שניתנת לאריזה מהמחזור`;'''
          if old not in s:
              raise SystemExit('Canonical packaging t-number anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/planning/PlanningBrewAssignmentEditor.tsx src/SERVICES/planning/productionCycle.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix stage0 brew relink and future packaging source validation'
          git push origin HEAD:planning-tank-schedule
