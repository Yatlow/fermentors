name: Deploy Planning Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions-planning/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions-deploy.yml"
  workflow_dispatch:

concurrency:
  group: firebase-planning-functions-production
  cancel-in-progress: true

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions-planning/package-lock.json

      - name: Install function dependencies
        working-directory: functions-planning
        run: npm ci

      - name: Validate function sources
        run: node --check functions-planning/index.cjs && node --check functions-planning/checkpoints.cjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FERMENTER_DASHBOARD_BADA3 }}

      - name: Deploy planning functions
        run: npx --yes firebase-tools deploy --only functions:brewery-planning --project fermenter-dashboard-bada3
