name: One-off audit live tank identity

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/silent-state-guards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply live tank identity audit patch
        run: python .github/scripts/oneoff_audit_live_tank_identity.py
      - name: Verify
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit patch and clean one-off files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-audit-live-tank-identity.yml .github/scripts/oneoff_audit_live_tank_identity.py
          git add src/components/dashboard/Dashboard.tsx src/components/dashboard/QuickTankReportBox.tsx src/components/dashboard/TankCard.tsx
          git commit -m 'Guard dashboard actions against stale tank identity'
          git push origin HEAD:audit/silent-state-guards
