name: One-off audit silent state guards

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/silent-state-guards
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply audit patch
        run: python .github/scripts/oneoff_audit_silent_state_guards.py
      - name: Verify
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit patch and clean one-off files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-audit-silent-state-guards.yml .github/scripts/oneoff_audit_silent_state_guards.py
          git add src/App.tsx src/SERVICES/cellering/calculateCelleringRecomendations.ts src/SERVICES/cellering/cellarActionState.ts tests/cellaring-action-state-regression.test.ts
          git commit -m 'Guard cellar action and draft state across updates'
          git push origin HEAD:audit/silent-state-guards
