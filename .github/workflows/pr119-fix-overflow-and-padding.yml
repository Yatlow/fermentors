name: PR119 fix brew override and confirmation padding
on:
  push:
    branches: [planning-tank-schedule]
    paths:
      - '.github/workflows/pr119-fix-overflow-and-padding.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix exceptional brew persistence and highlight
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/planning/PlanningWeeklyRecommendations.tsx')
          s=p.read_text(encoding='utf-8')

          # Changing beer style used to replace the entire row and silently drop
          # allowUnavailable. That is why an approved exceptional brew became
          # locked again as soon as its style was changed.
          old='''        setBrewDraft((rows) => rows.map((row, i) => i === index\n            ? { style, liters: brewLitersForSize(style, brewSizeLabel(row.liters)) }\n            : row));'''
          new='''        setBrewDraft((rows) => rows.map((row, i) => i === index\n            ? { ...row, style, liters: brewLitersForSize(style, brewSizeLabel(row.liters)) }\n            : row));'''
          if old in s:
              s=s.replace(old,new,1)
          elif '? { ...row, style, liters:' not in s:
              raise SystemExit('changeBrewStyle anchor missing')

          # Give approved exceptional rows a persistent visual treatment and label.
          old='<div className="bp-brew-edit-row" key={i}>'
          new='<div className={`bp-brew-edit-row ${b.allowUnavailable ? "is-approved-exception" : ""}`} key={i}>'
          if old in s:
              s=s.replace(old,new,1)
          elif 'is-approved-exception' not in s:
              raise SystemExit('brew edit row anchor missing')

          anchor='''                            <button onClick={() => setBrewDraft((d) => d.filter((_, j) => j !== i))}>הסר</button>'''
          replacement='''                            <button onClick={() => setBrewDraft((d) => d.filter((_, j) => j !== i))}>הסר</button>\n                            {b.allowUnavailable && <small className="bp-brew-exception-label">חריגה מאושרת · ניתן לבחור כל גודל</small>}'''
          if anchor in s:
              s=s.replace(anchor,replacement,1)
          elif 'bp-brew-exception-label' not in s:
              raise SystemExit('remove button anchor missing')

          required=['? { ...row, style, liters:','is-approved-exception','bp-brew-exception-label','!b.allowUnavailable && size !== currentSize']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('exception fix incomplete: '+repr(missing))
          p.write_text(s,encoding='utf-8')

          p=Path('src/components/planning/planningPackagingModal.css')
          s=p.read_text(encoding='utf-8')
          tag='/* Approved unavailable-tank brew exception */'
          if tag not in s:
              s += '''\n\n/* Approved unavailable-tank brew exception */\n.bp-brew-edit-row.is-approved-exception {\n  border: 2px solid #f59e0b;\n  border-radius: 10px;\n  padding: 8px;\n  background: #fff7ed;\n}\n.bp-brew-exception-label {\n  color: #b45309;\n  font-weight: 700;\n}\n'''
          p.write_text(s,encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/planning/PlanningWeeklyRecommendations.tsx src/components/planning/planningPackagingModal.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix exceptional brew editing and highlight approved exception"
          git push origin HEAD:planning-tank-schedule
