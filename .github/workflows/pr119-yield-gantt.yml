name: Apply PR119 chunked Gantt simulation
on:
  push:
    branches: [planning-tank-schedule]
    paths: ['.github/workflows/pr119-yield-gantt.yml']
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
      - run: python scripts/patch-pr119-yield-gantt-simulation.py
      - run: npm ci
      - name: Validate
        run: |
          npm run lint
          npm test -- --run
          npm run build
          git diff --check
      - name: Commit targeted change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/planning/PlanningGantt.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Yield between heavy Gantt planning calculations'
          git push origin HEAD:planning-tank-schedule
