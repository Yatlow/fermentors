name: PR119 Google holidays and Gantt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr119-google-holidays-gantt.yml
      - .github/scripts/apply-pr119-holidays.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply holiday patch
        run: |
          git fetch origin main
          git show origin/main:.github/scripts/apply-pr119-holidays.py > /tmp/apply-pr119-holidays.py
          python /tmp/apply-pr119-holidays.py
      - name: Validate
        run: |
          npm ci
          npm run build
          node .github/scripts/validate-apps-script-runtime.mjs
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/calendarService.js src/SERVICES/planning/usePlanning.ts src/components/planning/PlanningGantt.tsx src/components/planning/planningGantt.css
          git diff --cached --quiet && exit 0
          git commit -m "Sync Google national holidays and show them in Gantt"
          git push origin HEAD:planning-tank-schedule
