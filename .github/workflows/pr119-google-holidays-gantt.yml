name: PR119 Google holidays and Gantt

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply holiday patch from PR119 branch
        run: |
          git show origin/planning-tank-schedule:.github/workflows/pr119-google-holidays-gantt.yml > /tmp/pr119.yml
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('/tmp/pr119.yml').read_text()
          m = re.search(r'      - name: Patch holiday sync, dedupe and Gantt\n(.*?)(?=      - name: Validate\n)', s, re.S)
          if not m:
              raise SystemExit('Patch step not found')
          block = m.group(0)
          marker = '        run: |\n'
          script = block.split(marker, 1)[1]
          lines = script.splitlines()
          indent = min(len(x)-len(x.lstrip()) for x in lines if x.strip())
          Path('/tmp/patch.py').write_text('\n'.join(x[indent:] for x in lines) + '\n')
          PY
          python /tmp/patch.py
      - name: Validate
        run: |
          npm ci
          npm run build
          node .github/scripts/validate-apps-script-runtime.mjs
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server/calendarService.js src/SERVICES/planning/usePlanning.ts src/components/planning/PlanningGantt.tsx src/components/planning/planningGantt.css
          git diff --cached --quiet && exit 0
          git commit -m "Sync Google national holidays and show them in Gantt"
          git push origin HEAD:planning-tank-schedule
