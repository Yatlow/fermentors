name: Fix boil calculator volume and hops

on:
  push:
    branches: [fix/brew-boil-calculator-volume-hops]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brew-boil-calculator-volume-hops
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python scripts/patch-boil-calc-volume-hops.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-brew-boil-calculator-volume-hops.yml scripts/patch-boil-calc-volume-hops.py
          git add src/components/brewing/BrewFormStepper.tsx
          git commit -m "Fix boil calculator volume and hop recalculation"
          git push origin HEAD:fix/brew-boil-calculator-volume-hops
