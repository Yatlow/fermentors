name: Correct Historical Conflict Precedence (One Time)
on:
  pull_request:
    paths:
      - "scripts/correct-oldest-wins-historical.mjs"
      - ".github/workflows/correct-historical-conflicts.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/correct-historical-conflicts.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: historical-conflict-correction
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/correct-oldest-wins-historical.mjs --self-test
      - run: node scripts/crypto-daily-measurement-backup.mjs --self-test

  recover-and-correct:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FERMENTER_DASHBOARD_BADA3 }}
      - name: Recover original PRE-MIGRATION encrypted backup
        uses: actions/download-artifact@v4
        with:
          run-id: 38624238417
          repository: Yatlow/fermentors
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: encrypted-daily-measurements-8
          path: original
      - name: Decrypt original only inside job and validate complete backup
        run: |
          set -euo pipefail
          node scripts/crypto-daily-measurement-backup.mjs --decrypt original/measurement-backup.enc original-backup.json
      - name: Snapshot current live data BEFORE the corrective writes
        env:
          FIREBASE_PROJECT_ID: fermenter-dashboard-bada3
        run: |
          set -euo pipefail
          node scripts/reconcile-daily-measurements.mjs --snapshot > current-backup.json
          node scripts/crypto-daily-measurement-backup.mjs --encrypt current-backup.json current-backup.enc
          rm -f current-backup.json
          test -s current-backup.enc
      - name: Preserve current encrypted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: before-latest-wins-correction-${{ github.run_number }}
          path: current-backup.enc
          retention-days: 90
          if-no-files-found: error
      - name: Review safe correction counts, no writes
        env:
          FIREBASE_PROJECT_ID: fermenter-dashboard-bada3
        run: |
          node scripts/correct-oldest-wins-historical.mjs --preview --file original-backup.json > correction-preview.json
      - name: Apply guarded field-level correction
        env:
          FIREBASE_PROJECT_ID: fermenter-dashboard-bada3
          CONFIRM_HISTORICAL_LATEST_WINS: ONE_TIME_20261014
        run: |
          set -euo pipefail
          node scripts/correct-oldest-wins-historical.mjs --apply --file original-backup.json > correction-report.json
      - name: Upload counts-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-wins-correction-report-${{ github.run_number }}
          path: |
            correction-report.json
            correction-preview.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Clean decrypted backup from workspace
        if: always()
        run: rm -f original-backup.json
