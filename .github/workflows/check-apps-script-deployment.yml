name: Check Apps Script deployment

on:
  push:
    branches:
      - feature/shipment-aa-appsscript-deploy
    paths:
      - ".github/workflows/check-apps-script-deployment.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Verify project and deployment
        env:
          EXPECTED_DEPLOYMENT_ID: AKfycbzSq8vnL_P9DOkiXluKReSUNFILqlRkK-WxnPC_Q0BNt23rFHbLpRlkvPudbqElqw5h
        run: |
          test -f .clasp.json
          DEPLOYMENTS="$(clasp deployments)"
          printf '%s\n' "$DEPLOYMENTS"
          printf '%s\n' "$DEPLOYMENTS" | grep -F "$EXPECTED_DEPLOYMENT_ID"
