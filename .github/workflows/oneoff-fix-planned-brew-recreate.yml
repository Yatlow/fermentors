name: One-off fix planned brew recreation

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-planned-brew-recreate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch BrewingView
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/brewing/BrewingView.tsx')
          text = path.read_text()

          replacements = [
              (
                  '''    const currentProductionBatchNumbers = useMemo(\n        () =>\n            new Set(\n                editableProductionTanks\n                    .map((tank) =>\n                        String(tank.batchNumber || "").replace("#", "").trim(),\n                    )\n                    .filter(Boolean),\n            ),\n        [editableProductionTanks],\n    );''',
                  '''    const currentProductionBatchNumbers = useMemo(\n        () =>\n            new Set(\n                brews\n                    .filter((tank) => Number(tank.action) === 0 || Number(tank.action) === 1)\n                    .map((tank) =>\n                        String(tank.batchNumber || "").replace("#", "").trim(),\n                    )\n                    .filter(Boolean),\n            ),\n        [brews],\n    );'''
              ),
              (
                  '''        return brews.some((tank) => String(tank.batchNumber || "").replace("#", "").trim() === clean) ||''',
                  '''        return brews.some((tank) =>\n            (Number(tank.action) === 0 || Number(tank.action) === 1) &&\n            String(tank.batchNumber || "").replace("#", "").trim() === clean\n        ) ||'''
              ),
              (
                  '''                ...brews.map((tank) => String(tank.batchNumber || "").replace("#", "").trim()),''',
                  '''                ...brews\n                    .filter((tank) => Number(tank.action) === 0 || Number(tank.action) === 1)\n                    .map((tank) => String(tank.batchNumber || "").replace("#", "").trim()),'''
              ),
              (
                  '''            brews.find(\n                (tank) =>\n                    String(tank.batchNumber || "").replace("#", "").trim() === clean,\n            ) || null''',
                  '''            brews.find(\n                (tank) =>\n                    (Number(tank.action) === 0 || Number(tank.action) === 1) &&\n                    String(tank.batchNumber || "").replace("#", "").trim() === clean,\n            ) || null'''
              ),
              (
                  '''        const liveTank = brews.find((item) =>\n            String(item.batchNumber || "").replace("#", "").trim() === run.batchNumber,\n        );''',
                  '''        const liveTank = brews.find((item) =>\n            (Number(item.action) === 0 || Number(item.action) === 1) &&\n            String(item.batchNumber || "").replace("#", "").trim() === run.batchNumber,\n        );'''
              ),
              (
                  '''        const assignedTank = brews.find((item) =>\n            String(item.batchNumber || "").replace("#", "").trim() === deleteConfirmation.batchNumber,\n        );''',
                  '''        const assignedTank = brews.find((item) =>\n            (Number(item.action) === 0 || Number(item.action) === 1) &&\n            String(item.batchNumber || "").replace("#", "").trim() === deleteConfirmation.batchNumber,\n        );'''
              ),
              (
                  '''                    createdBatchNumbers={[...new Set([...brews.map((tank) => String(tank.batchNumber || "")), ...pendingProductionRows.map((row) => String(row.batchNumber || "")), ...creationJobs.map((job) => String(job.batchNumber || ""))].filter(Boolean))]}''',
                  '''                    createdBatchNumbers={[...new Set([\n                        ...brews\n                            .filter((tank) => Number(tank.action) === 0 || Number(tank.action) === 1)\n                            .map((tank) => String(tank.batchNumber || "")),\n                        ...pendingProductionRows.map((row) => String(row.batchNumber || "")),\n                        ...creationJobs.map((job) => String(job.batchNumber || "")),\n                    ].filter(Boolean))]}'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected source block not found:\n{old[:180]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/brewing/BrewingView.tsx
          git commit -m 'Allow recreating deleted planned brew batches'
          git push origin HEAD:main
