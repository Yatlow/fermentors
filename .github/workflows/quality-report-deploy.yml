name: Deploy quality-report Cloud Functions (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy-quality-backend:
    # Deliberately manual: installing the authorized Apps Script worker is a prerequisite.
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate server
        run: |
          node --check functions/index.mjs
          node --test functions/tests/*.test.mjs
          npm install --prefix functions --no-audit --no-fund --ignore-scripts
          node --input-type=module -e "await import('./functions/index.mjs')"
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FERMENTER_DASHBOARD_BADA3 }}
      - name: Identify the deploying service account (email only)
        run: |
          node -e "const fs=require('node:fs'); const p=process.env.GOOGLE_APPLICATION_CREDENTIALS; const x=JSON.parse(fs.readFileSync(p,'utf8')); console.log('Deploying service account: '+x.client_email)"
      - name: Prepare non-secret intake configuration
        env:
          HOSTS: ${{ vars.QUALITY_ALLOWED_HOSTS }}
          BUCKET: ${{ vars.QUALITY_UPLOAD_BUCKET }}
        run: |
          HOSTS="${HOSTS:-fermenter-dashboard-bada3.web.app,fermenter-dashboard-bada3.firebaseapp.com}"
          HOSTS="${HOSTS},fermenter-dashboard-bada3--pr252-feature-public-quali-r1p21j2p.web.app"
          BUCKET="${BUCKET:-fermenter-dashboard-bada3.firebasestorage.app}"
          test -n "$BUCKET" || { echo "::error::Missing QUALITY_UPLOAD_BUCKET"; exit 1; }
          {
            printf 'QUALITY_UPLOAD_BUCKET=%s\n' "$BUCKET"
            printf 'QUALITY_ALLOWED_HOSTS=%s\n' "$HOSTS"
          } > functions/.env.fermenter-dashboard-bada3
      - name: Install gcloud for deployment diagnostics
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: fermenter-dashboard-bada3
      - name: Deploy backend only (does not touch Hosting)
        id: deploy-functions
        shell: bash
        run: |
          set -o pipefail
          # --force configures the artifact cleanup policy in non-interactive CI (quality-reports codebase only).
          # At cutover Firebase also removes the two retired scheduler-backed
          # functions. Ensure the CI service account has cloudscheduler.jobs.delete.
          npx --yes firebase-tools deploy --only functions:quality-reports --project fermenter-dashboard-bada3 --non-interactive --force 2>&1 | tee "$RUNNER_TEMP/quality-functions-deploy.log"
      - name: Diagnose failed Cloud Build operations
        if: ${{ failure() && steps.deploy-functions.outcome == 'failure' }}
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/quality-functions-deploy.log"
          test -f "$LOG" || exit 0
          mapfile -t BUILD_IDS < <(grep -oE 'cloud-build/builds;region=europe-west1/[0-9a-f-]{36}' "$LOG" | sed 's#.*/##' | sort -u || true)
          if [ "${#BUILD_IDS[@]}" -eq 0 ]; then
            echo "::notice::No Cloud Build ID in deploy output; inspect Firebase IAM or Artifact Registry failure above."
          fi
          for ID in "${BUILD_IDS[@]}"; do
            echo "::group::Cloud Build $ID status and error"
            gcloud builds describe "$ID" --region=europe-west1 --project=fermenter-dashboard-bada3 --format='yaml(id,status,statusDetail,failureInfo)' || true
            echo "::endgroup::"
            echo "::group::Cloud Build $ID last 120 log lines"
            gcloud builds log "$ID" --region=europe-west1 --project=fermenter-dashboard-bada3 2>&1 | tail -n 120 || true
            echo "::endgroup::"
          done
