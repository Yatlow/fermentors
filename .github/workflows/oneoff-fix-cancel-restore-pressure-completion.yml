name: One-off fix cancel restore and pressure completion

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-cancel-restore-pressure-completion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch BrewingView restore
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/components/brewing/BrewingView.tsx"); s=p.read_text(); a=s.index("            const cellarState ="); b=s.index("        } catch (error) {", a); r="            const cellarState =\n                tank.cellarState && typeof tank.cellarState === \"object\"\n                    ? tank.cellarState as Record<string, unknown>\n                    : null;\n            const deletedBatch = String(run.batchNumber || \"\").replace(\"#\", \"\").trim();\n            const cellarBatch = String(cellarState?.batchNumber || \"\").replace(\"#\", \"\").trim();\n            const cellarStateIsPrevious = Boolean(cellarState && cellarBatch && cellarBatch !== deletedBatch);\n            const previousRun = productionHistory\n                .filter((item) => String(item.tankNumber || \"\") === String(tank.tankNumber ?? tank.id))\n                .filter((item) => String(item.batchNumber || \"\").replace(\"#\", \"\").trim() !== deletedBatch)\n                .filter((item) => !!String(item.brewDate || \"\").trim())\n                .sort((a, b) => {\n                    const batchDelta = Number(b.batchNumber || 0) - Number(a.batchNumber || 0);\n                    return Number.isFinite(batchDelta) && batchDelta !== 0\n                        ? batchDelta\n                        : String(b.brewDate || \"\").localeCompare(String(a.brewDate || \"\"));\n                })[0];\n\n            let restoredBatch = \"\";\n            if (cellarStateIsPrevious) {\n                restoredBatch = cellarBatch;\n                await updateDoc(doc(db, \"fermentors\", tank.id), {\n                    ...cellarState,\n                    action: 5,\n                    stage: 5,\n                    tankStatus: true,\n                    cellarState: deleteField(),\n                });\n            } else {\n                restoredBatch = String(previousRun?.batchNumber || \"\").replace(\"#\", \"\").trim();\n                await updateDoc(doc(db, \"fermentors\", tank.id), {\n                    ...(cellarState || {}),\n                    batchNumber: previousRun?.batchNumber || \"\",\n                    beerStyle: previousRun?.beerStyle || \"\",\n                    brewDate: previousRun?.brewDate || \"\",\n                    sheetUrl: previousRun?.sheetUrl || \"\",\n                    action: 5,\n                    stage: 5,\n                    tankStatus: true,\n                    cellarState: deleteField(),\n                });\n            }\n            setSelectedRun(null);\n            setPendingProductionRows((current) => current.filter((row) => String(row.batchNumber || \"\").replace(\"#\", \"\").trim() !== run.batchNumber));\n            setProductionHistory((current) => current.filter((row) => String(row.batchNumber || \"\").replace(\"#\", \"\").trim() !== run.batchNumber));\n            setMessage(restoredBatch ? `✓ אצווה ${run.batchNumber} נמחקה. המיכל הוחזר למחוטא עם אצווה ${restoredBatch} וה-state הקודם שלה.` : `✓ אצווה ${run.batchNumber} נמחקה והמיכל הוחזר למחוטא.`);\n"; p.write_text(s[:a]+r+s[b:])'
      - name: Patch pressure completion
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/SERVICES/cellering/calculateCelleringRecomendations.ts"); s=p.read_text(); a=s.index("    const carbRes = lastMeasurement.carbonation;"); b=s.index("    const prvHandledToday =", a); r="    const carbRes = lastMeasurement.carbonation;\n    const pressureHandledToday = sortedMeasurements.some((measurement) => {\n        if (getMeasurementDate(measurement.id) !== todayDate) return false;\n        const note = String(measurement.notes ?? \"\");\n        return (\n            note.includes(\"הורדת לחץ\") ||\n            note.includes(\"העלאת לחץ\") ||\n            note.includes(\"להוריד לחץ\") ||\n            note.includes(\"להעלות לחץ\") ||\n            note.includes(\"גיזוז מלמטה\")\n        );\n    });\n    const noteAdjustedPrvToday =\n        lastNote?.includes(\"כיוון פורק\") ||\n        lastNote?.includes(\"לכוון פורק\");\n\n    // Completion is action-based, not row-based: the carbonation test and the\n    // corrective pressure action are often logged as separate rows. A normal\n    // pressure measurement alone still does not count; an explicit pressure\n    // action (including bottom carbonation) must be recorded today.\n"; p.write_text(s[:a]+r+s[b:])'
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/brewing/BrewingView.tsx src/SERVICES/cellering/calculateCelleringRecomendations.ts
          git commit -m 'Fix cancelled brew restore and pressure completion'
          git push origin HEAD:main
