name: One-off fix cancel restore and pressure completion

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-cancel-restore-pressure-completion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch pressure completion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/SERVICES/cellering/calculateCelleringRecomendations.ts')
          text = path.read_text()
          old = '''    const pressureAdjustmentHandledToday = {
        completed: Boolean(
            stage.name === "קר" &&
            lastMeasurementDate === todayDate &&
            hasLatestCarb &&
            latestCarbSpec.outOfSpec &&
            pressureHandledToday
        ),'''
          new = '''    const pressureAdjustmentHandledToday = {
        completed: Boolean(
            stage.name === "קר" &&
            pressureHandledToday
        ),'''
          if old not in text:
              raise SystemExit('pressure completion block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SERVICES/cellering/calculateCelleringRecomendations.ts
          git commit -m 'Fix pressure decision completion detection'
          git push origin HEAD:main
