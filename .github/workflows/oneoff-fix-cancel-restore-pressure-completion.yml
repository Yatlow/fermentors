name: One-off fix cancel restore and pressure completion

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-cancel-restore-pressure-completion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch pressure completion
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/SERVICES/cellering/calculateCelleringRecomendations.ts"); s=p.read_text(); old="    const pressureAdjustmentHandledToday = {\n        completed: Boolean(\n            stage.name === \"קר\" &&\n            lastMeasurementDate === todayDate &&\n            hasLatestCarb &&\n            latestCarbSpec.outOfSpec &&\n            pressureHandledToday\n        ),"; new="    const pressureAdjustmentHandledToday = {\n        completed: Boolean(\n            stage.name === \"קר\" &&\n            pressureHandledToday\n        ),"; assert old in s, "pressure completion block not found"; p.write_text(s.replace(old,new,1))'
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SERVICES/cellering/calculateCelleringRecomendations.ts
          git commit -m 'Fix pressure decision completion detection'
          git push origin HEAD:main
