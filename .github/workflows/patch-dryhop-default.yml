name: Patch dry-hop aa default

on:
  push:
    branches:
      - feature/shipment-aa-appsscript-deploy
    paths:
      - ".github/workflows/patch-dryhop-default.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shipment-aa-appsscript-deploy

      - name: Apply robust aa default
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/dashboard/QuickTankReportBox.tsx')
          text = p.read_text()

          anchor = '''    function resetValues() {\n        setValue(\"\"); setValue2(\"\"); setDryHopAa(\"\"); setDirection(\"\");\n'''
          helper = '''    function resolveDryHopAaValue(): string {\n        if (dryHopAa !== \"\") return dryHopAa;\n        if (noteType !== \"דרייהופ\" || !specs) return \"\";\n\n        const category = getDryHopStyleCategory(tank.beerStyle);\n        const calc = calcDryHopDose(category, tank.beerVolume);\n        const hopType = calc.needsManualInput ? value2.trim() : calc.hopType;\n        if (!hopType) return \"\";\n\n        const defaultAa = getHopAa(hopType, specs);\n        return defaultAa !== null ? String(defaultAa) : \"\";\n    }\n\n    function resetValues() {\n        setValue(\"\"); setValue2(\"\"); setDryHopAa(\"\"); setDirection(\"\");\n'''
          if 'function resolveDryHopAaValue()' not in text:
              if anchor not in text:
                  raise SystemExit('resetValues anchor not found')
              text = text.replace(anchor, helper, 1)

          text = text.replace('!isValidHopAa(dryHopAa)', '!isValidHopAa(resolveDryHopAaValue())')
          text = text.replace('const aa = Number(dryHopAa);', 'const aa = Number(resolveDryHopAaValue());')
          text = text.replace('value={dryHopAa}', 'value={resolveDryHopAaValue()}')

          p.write_text(text)
          PY

      - name: Verify build
        run: npm ci && npm run build

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/dashboard/QuickTankReportBox.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Make dry-hop aa default deterministic"
          git push origin HEAD:feature/shipment-aa-appsscript-deploy
