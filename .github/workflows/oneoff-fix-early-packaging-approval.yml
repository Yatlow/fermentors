name: One-off fix early packaging approval

on:
  push:
    branches:
      - fix/planning-early-packaging-regressions
    paths:
      - '.github/workflows/oneoff-fix-early-packaging-approval.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/planning-early-packaging-regressions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Patch approval persistence and release inference
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Persist the planner's early-packaging approval on the packaging row.
          path = Path('src/SERVICES/planning/planningEngine.ts')
          text = path.read_text()
          old = '  emptyTank?: boolean;\n  tankNumber?: string;'
          new = '  emptyTank?: boolean;\n  earlyPackagingOverride?: boolean;\n  tankNumber?: string;'
          if old not in text:
              raise SystemExit('Plan type marker not found')
          path.write_text(text.replace(old, new, 1))

          # Saved row-level approval satisfies future validation without a new modal.
          path = Path('src/SERVICES/planning/productionCycle.ts')
          text = path.read_text()
          old = '    if (r.date < t.ready && !options?.allowEarlyPackaging)\n      return `מיכל ${t.number}: האריזה שובצה ל-${r.date} לפני מועד ההבשלה ${t.ready}`;'
          new = '    if (r.date < t.ready && !r.earlyPackagingOverride && !options?.allowEarlyPackaging)\n      return `מיכל ${t.number}: האריזה שובצה ל-${r.date} לפני מועד ההבשלה ${t.ready}`;'
          if old not in text:
              raise SystemExit('validateProduction readiness marker not found')
          path.write_text(text.replace(old, new, 1))

          # Gantt save flow: infer final emptying from the open remainder, migrate
          # already-saved early rows silently, and persist new approvals per row.
          path = Path('src/components/planning/PlanningBoard.tsx')
          text = path.read_text()
          old = '''  addDays,\n  emptyWeek,\n  sameStyle,'''
          new = '''  addDays,\n  emptyWeek,\n  litersPerUnit,\n  sameStyle,'''
          if old not in text:
              raise SystemExit('planningEngine import marker not found')
          text = text.replace(old, new, 1)

          old = 'import { futureTanks, shortDate, type ShipmentEvent } from "../../SERVICES/planning/dailyPlanner";'
          new = 'import { futureTanks, openRuns, shortDate, type ShipmentEvent } from "../../SERVICES/planning/dailyPlanner";'
          if old not in text:
              raise SystemExit('dailyPlanner import marker not found')
          text = text.replace(old, new, 1)

          helper_marker = '''function confirmAssignedBrews(plan: WeekPlan): WeekPlan {\n  return {\n    ...plan,\n    brews: plan.brews.map((brew) => brew.tankId\n      ? { ...brew, tankAssignmentStatus: "confirmed" as const }\n      : brew),\n  };\n}\n'''
          helper = helper_marker + '''\nfunction inferDatedEmptyTankFlags(\n  plan: WeekPlan,\n  tanks: Tank[],\n  settings: Settings,\n  actuals: Actual[],\n): WeekPlan {\n  const next = structuredClone(plan);\n  const opened = openRuns([next], settings.products, actuals)\n    .filter((run) => run.remaining > 0 && !!run.tankId);\n\n  for (const tank of tanks) {\n    const runs = opened\n      .filter((run) => run.tankId === tank.id)\n      .sort((a, b) => (a.date ?? "9999-99-99").localeCompare(b.date ?? "9999-99-99") || a.key.localeCompare(b.key));\n    if (!runs.length || runs.some((run) => !run.date)) continue;\n\n    const plannedLiters = runs.reduce((sum, run) => {\n      const product = settings.products.find((item) => item.id === run.productId);\n      return sum + (product ? run.remaining * litersPerUnit(product) : 0);\n    }, 0);\n    if (tank.liters - plannedLiters >= 20) continue;\n\n    const last = runs[runs.length - 1];\n    next.packaging = next.packaging.map((run, index) => {\n      if (run.tankId !== tank.id) return run;\n      const key = run.id ?? `${next.id}:${run.productId}:${index}`;\n      return { ...run, emptyTank: key === last.key };\n    });\n  }\n\n  return next;\n}\n'''
          if helper_marker not in text:
              raise SystemExit('helper insertion marker not found')
          text = text.replace(helper_marker, helper, 1)

          old = '''    const confirmedNext = confirmBrews ? confirmAssignedBrews(next) : next;\n    const effectiveNext = normalizeEmptyTankFlagsForSchedule(confirmedNext);\n    const all = [...plans.filter((w) => w.id !== effectiveNext.id), effectiveNext];\n    const error = validatePlanningWeek(effectiveNext, settings, all, today);\n    if (error) throw new Error(error);\n\n    const datedOnly = all.map((w) => ({ ...w, packaging: w.packaging.filter((run) => !!run.date) }));\n    const validationTanks = futureTanks(tanks, all, settings);\n    let production = validateProduction(datedOnly, settings, validationTanks, actuals, today);\n    if (production?.includes("לפני מועד ההבשלה")) {\n      // Read-only users cannot reach persist at all. For users with planning\n      // write access, early packaging is an explicit operational exception.\n      setBusy(false);\n      const approved = await requestEarlyPackagingOverride(production);\n      if (!approved) throw new Error("השיבוץ בוטל.");\n      setBusy(true);\n      production = validateProduction(\n        datedOnly,\n        settings,\n        validationTanks,\n        actuals,\n        today,\n        { allowEarlyPackaging: true },\n      );\n    }\n    if (production) throw new Error(production);\n'''
          new = '''    const confirmedNext = confirmBrews ? confirmAssignedBrews(next) : next;\n    let effectiveNext = normalizeEmptyTankFlagsForSchedule(\n      inferDatedEmptyTankFlags(confirmedNext, tanks, settings, actuals),\n    );\n\n    // Rows that are already saved at the same early date necessarily passed the\n    // planner confirmation in an older build. Stamp them once so subsequent\n    // edits do not ask for the same exception again.\n    let provisionalAll = [...plans.filter((w) => w.id !== effectiveNext.id), effectiveNext];\n    let validationTanks = futureTanks(tanks, provisionalAll, settings);\n    effectiveNext = {\n      ...effectiveNext,\n      packaging: effectiveNext.packaging.map((run) => {\n        if (!run.date || !run.tankId || run.earlyPackagingOverride) return run;\n        const tank = validationTanks.find((item) => item.id === run.tankId);\n        if (!tank || run.date >= tank.ready) return run;\n        const alreadySaved = current.packaging.some((saved) =>\n          saved.id === run.id && saved.tankId === run.tankId && saved.date === run.date\n        );\n        return alreadySaved ? { ...run, earlyPackagingOverride: true } : run;\n      }),\n    };\n\n    let all = [...plans.filter((w) => w.id !== effectiveNext.id), effectiveNext];\n    const error = validatePlanningWeek(effectiveNext, settings, all, today);\n    if (error) throw new Error(error);\n\n    let datedOnly = all.map((w) => ({ ...w, packaging: w.packaging.filter((run) => !!run.date) }));\n    validationTanks = futureTanks(tanks, all, settings);\n    let production = validateProduction(datedOnly, settings, validationTanks, actuals, today);\n    if (production?.includes("לפני מועד ההבשלה")) {\n      setBusy(false);\n      const approved = await requestEarlyPackagingOverride(production);\n      if (!approved) throw new Error("השיבוץ בוטל.");\n      setBusy(true);\n\n      effectiveNext = {\n        ...effectiveNext,\n        packaging: effectiveNext.packaging.map((run) => {\n          if (!run.date || !run.tankId) return run;\n          const tank = validationTanks.find((item) => item.id === run.tankId);\n          return tank && run.date < tank.ready\n            ? { ...run, earlyPackagingOverride: true }\n            : run;\n        }),\n      };\n      all = [...plans.filter((w) => w.id !== effectiveNext.id), effectiveNext];\n      datedOnly = all.map((w) => ({ ...w, packaging: w.packaging.filter((run) => !!run.date) }));\n      validationTanks = futureTanks(tanks, all, settings);\n      production = validateProduction(datedOnly, settings, validationTanks, actuals, today);\n    }\n    if (production) throw new Error(production);\n'''
          if old not in text:
              raise SystemExit('persist validation block not found')
          path.write_text(text.replace(old, new, 1))

          # Regression coverage for row-level approval and inferred emptying.
          path = Path('tests/planning-weekly-regression.test.ts')
          text = path.read_text()
          old = '''  normalizeEmptyTankFlagsForSchedule,\n  tankReleases,'''
          new = '''  normalizeEmptyTankFlagsForSchedule,\n  tankReleases,\n  validateProduction,'''
          if old not in text:
              raise SystemExit('test import marker not found')
          text = text.replace(old, new, 1)

          insert_before = 'test("brew size helpers keep weekly editing on single/double/triple labels", () => {'
          if insert_before not in text:
              raise SystemExit('test insertion marker not found')
          tests = r'''test("saved early packaging approval avoids repeated readiness confirmation", () => {\n  const tank: Tank = {\n    id: "tank-approved-early",\n    number: "4",\n    batch: "approved-early",\n    style: "IPA",\n    brewed: "2026-09-01",\n    ready: "2026-09-24",\n    liters: 1000,\n    cold: true,\n  };\n  const plan = {\n    ...emptyWeek("2026-09-20"),\n    packaging: [{\n      id: "approved-early-pack",\n      productId: product.id,\n      quantity: 84,\n      date: "2026-09-22",\n      tankId: tank.id,\n      tankNumber: tank.number,\n      earlyPackagingOverride: true,\n    }],\n  };\n\n  assert.equal(validateProduction([plan], settings, [tank], [], today), null);\n});\n\n'''
          path.write_text(text.replace(insert_before, tests + insert_before, 1))
          PY

      - name: Verify
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-fix-early-packaging-approval.yml
          git add src/SERVICES/planning/planningEngine.ts src/SERVICES/planning/productionCycle.ts src/components/planning/PlanningBoard.tsx tests/planning-weekly-regression.test.ts
          git commit -m 'Persist early packaging approvals and release drained tanks'
          git push origin HEAD:fix/planning-early-packaging-regressions
