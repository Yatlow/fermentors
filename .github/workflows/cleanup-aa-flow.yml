name: Cleanup dry-hop aa flow

on:
  push:
    branches:
      - feature/shipment-aa-appsscript-deploy
    paths:
      - ".github/workflows/cleanup-aa-flow.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shipment-aa-appsscript-deploy

      - name: Remove direct Firestore read from QuickTankReportBox
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/dashboard/QuickTankReportBox.tsx')
          text = p.read_text()

          text = text.replace('import { doc, onSnapshot } from "firebase/firestore";\n', '')
          text = text.replace('import { db } from "../../firebase";\n', '')
          text = text.replace('    const [hopAaSpecs, setHopAaSpecs] = useState<Record<string, number> | null>(null);\n', '')

          start = text.find('    // Read specs/hops directly while the quick-report modal is open.\n')
          end = text.find('    useEffect(() => {\n        if (noteType !== "דרייהופ"', start)
          if start != -1 and end != -1:
              text = text[:start] + text[end:]

          text = text.replace('const defaultAa = resolveConfiguredHopAa(calc.hopType);', 'const defaultAa = getHopAa(calc.hopType, specs);')
          text = text.replace('const defaultAa = resolveConfiguredHopAa(hopType);', 'const defaultAa = getHopAa(hopType, specs);')
          text = text.replace('[noteType, specs, hopAaSpecs, dryHopAa, tank.beerStyle, tank.beerVolume]', '[noteType, specs, dryHopAa, tank.beerStyle, tank.beerVolume]')

          p.write_text(text)
          PY

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/check-clasp-secret.yml
          rm -f .github/workflows/patch-aa-direct-firestore.yml
          rm -f .github/workflows/cleanup-aa-flow.yml

      - name: Verify build
        run: npm ci && npm run build

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use shared specs for dry-hop aa and remove temp workflows"
          git push origin HEAD:feature/shipment-aa-appsscript-deploy
