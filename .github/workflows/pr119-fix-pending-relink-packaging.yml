name: Fix PR119 pending brew relink and canonical packaging
on:
  workflow_dispatch:
  push:
    branches: [planning-tank-schedule]
    paths: ['.github/workflows/pr119-fix-pending-relink-packaging.yml']
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply pending relink and canonical packaging fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Planning brew editor: link only real not-yet-started brews:
          # pendingBrews + ACTION 0. History / ACTION 1 must not be offered.
          p = Path('src/components/planning/PlanningBrewAssignmentEditor.tsx')
          s = p.read_text()

          old = 'import { useEffect, useMemo, useState } from "react";\nimport type { Fermentor } from "../../App";'
          new = 'import { useEffect, useMemo, useState } from "react";\nimport { collection, getDocs } from "firebase/firestore";\nimport type { Fermentor } from "../../App";\nimport { db } from "../../firebase";'
          if old not in s:
              raise SystemExit('editor import anchor not found')
          s = s.replace(old, new, 1)

          old = '  const [existingBrews, setExistingBrews] = useState<BrewSummary[]>([]);\n  const [busy, setBusy] = useState(false);'
          new = '  const [existingBrews, setExistingBrews] = useState<BrewSummary[]>([]);\n  const [linkableBrews, setLinkableBrews] = useState<BrewSummary[]>([]);\n  const [busy, setBusy] = useState(false);'
          if old not in s:
              raise SystemExit('editor state anchor not found')
          s = s.replace(old, new, 1)

          old = '''  useEffect(() => {\n    let cancelled = false;\n    getBrewsSummaryPage(null, 100)\n      .then(({ rows: history }) => {\n        if (cancelled) return;\n        setExistingBrews(history);\n        setBatchBase(Math.max(\n          maxBatch(history.map((brew) => brew.batchNumber)),\n          maxBatch(brews.map((brew) => brew.batchNumber)),\n          maxBatch(priorPlannedBatches),\n        ));\n      })\n      .catch(() => undefined);\n    return () => { cancelled = true; };\n  }, [brews, priorPlannedBatches]);'''
          new = '''  useEffect(() => {\n    let cancelled = false;\n    Promise.all([\n      getBrewsSummaryPage(null, 100),\n      getDocs(collection(db, "pendingBrews")),\n    ])\n      .then(([{ rows: history }, pendingSnapshot]) => {\n        if (cancelled) return;\n        const pending = pendingSnapshot.docs.map((item) => {\n          const data = item.data() as Record<string, unknown>;\n          return {\n            id: item.id,\n            batchNumber: String(data.batchNumber ?? item.id),\n            beerStyle: String(data.beerStyle ?? ""),\n            brewDate: String(data.brewDate ?? ""),\n            sheetUrl: String(data.sheetUrl ?? ""),\n            tankNumber: String(data.tankNumber ?? ""),\n          } satisfies BrewSummary;\n        });\n        const actionZeroBatches = new Set(\n          brews\n            .filter((source) => Number(source.action) === 0)\n            .map((source) => normalizedBatch(source.batchNumber))\n            .filter(Boolean),\n        );\n        const actionZeroHistory = history.filter((brew) => actionZeroBatches.has(normalizedBatch(brew.batchNumber)));\n        const linkable = new Map<string, BrewSummary>();\n        [...pending, ...actionZeroHistory].forEach((brew) => {\n          const key = normalizedBatch(brew.batchNumber) || brew.id;\n          if (key) linkable.set(key, brew);\n        });\n        setExistingBrews(history);\n        setLinkableBrews([...linkable.values()]);\n        setBatchBase(Math.max(\n          maxBatch(history.map((brew) => brew.batchNumber)),\n          maxBatch(pending.map((brew) => brew.batchNumber)),\n          maxBatch(brews.map((brew) => brew.batchNumber)),\n          maxBatch(priorPlannedBatches),\n        ));\n      })\n      .catch(() => undefined);\n    return () => { cancelled = true; };\n  }, [brews, priorPlannedBatches]);'''
          if old not in s:
              raise SystemExit('editor history effect anchor not found')
          s = s.replace(old, new, 1)

          old = '    const existingById = new Map(existingBrews.map((brew) => [brew.id, brew]));'
          new = '    const existingById = new Map([...existingBrews, ...linkableBrews].map((brew) => [brew.id, brew]));'
          if old not in s:
              raise SystemExit('editor existingById anchor not found')
          s = s.replace(old, new, 1)

          old = '''        .concat(existingBrews.map((source) => Number(normalizedBatch(source.batchNumber))))\n        .filter((value) => Number.isFinite(value) && value > 0),'''
          new = '''        .concat(existingBrews.map((source) => Number(normalizedBatch(source.batchNumber))))\n        .concat(linkableBrews.map((source) => Number(normalizedBatch(source.batchNumber))))\n        .filter((value) => Number.isFinite(value) && value > 0),'''
          if old not in s:
              raise SystemExit('editor reserved batches anchor not found')
          s = s.replace(old, new, 1)

          s = s.replace(
            '  }, [draft.brews, batchBase, brews, existingBrews]);',
            '  }, [draft.brews, batchBase, brews, existingBrews, linkableBrews]);',
            1,
          )

          old = '    const existing = existingBrews.find((brew) => brew.id === existingId);'
          new = '    const existing = linkableBrews.find((brew) => brew.id === existingId) ?? existingBrews.find((brew) => brew.id === existingId);'
          if old not in s:
              raise SystemExit('editor link handler anchor not found')
          s = s.replace(old, new, 1)

          old = '''                {existingBrews\n                  .filter((existing) => existing.beerStyle.trim().toLowerCase() === selectedBrew.style.trim().toLowerCase())\n                  .map((existing) => <option key={existing.id} value={existing.id}>#{existing.batchNumber} · {displayStyle(existing.beerStyle)} · מיכל {existing.tankNumber || "—"}</option>)}'''
          new = '''                {linkableBrews\n                  .filter((existing) => existing.beerStyle.trim().toLowerCase() === selectedBrew.style.trim().toLowerCase())\n                  .map((existing) => <option key={existing.id} value={existing.id}>#{existing.batchNumber} · {displayStyle(existing.beerStyle)} · {existing.tankNumber ? `מיכל ${existing.tankNumber}` : "ממתין למיכל"}</option>)}'''
          if old not in s:
              raise SystemExit('editor dropdown anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Canonical future packaging: a planned brew cycle is sufficient.
          # Do not require the current physical Tank snapshot to exist for the
          # future cycle. Physical tank data remains mandatory only for legacy rows.
          p = Path('src/SERVICES/planning/productionCycle.ts')
          s = p.read_text()

          old = '''    const t = tanks.find((t) => t.id === tankId);\n    const p = settings.products.find((p) => p.id === r.productId);\n    const runType = r.nonInventoryType ?? p?.type;\n    if (!t) return "חסר מיכל מקור לאריזה";\n\n    const projectedCycle = linkedBrewId\n      ? projectTankSchedules(plans, settings).get(tankId)?.find((cycle) => cycle.cycleId === linkedBrewId)\n      : null;\n    const readyDate = projectedCycle?.readyDate ?? t.ready;\n    if (r.date < readyDate && !r.earlyPackagingOverride && !options?.allowEarlyPackaging)\n      return `מיכל ${t.number}: האריזה שובצה ל-${r.date} לפני מועד ההבשלה ${readyDate}`;'''
          new = '''    const t = tanks.find((t) => t.id === tankId);\n    const p = settings.products.find((p) => p.id === r.productId);\n    const runType = r.nonInventoryType ?? p?.type;\n    if (!linkedBrew && !t) return "חסר מיכל מקור לאריזה";\n\n    const projectedCycle = linkedBrewId\n      ? projectTankSchedules(plans, settings).get(tankId)?.find((cycle) => cycle.cycleId === linkedBrewId)\n      : null;\n    const fallbackLeadDays = linkedBrew\n      ? Math.max(21, ...settings.products.filter((product) => sameStyle(product.style, linkedBrew.style)).map((product) => product.leadDays))\n      : 0;\n    const readyDate = projectedCycle?.readyDate\n      ?? (linkedBrew ? addDays(linkedBrew.date, fallbackLeadDays) : t?.ready ?? "");\n    const tankLabel = t?.number ?? linkedBrew?.tankId ?? tankId;\n    if (readyDate && r.date < readyDate && !r.earlyPackagingOverride && !options?.allowEarlyPackaging)\n      return `מיכל ${tankLabel}: האריזה שובצה ל-${r.date} לפני מועד ההבשלה ${readyDate}`;'''
          if old not in s:
              raise SystemExit('canonical packaging tank anchor not found')
          s = s.replace(old, new, 1)

          s = s.replace('return `מיכל ${t.number}: פיצול לימים שונים מותר רק בין בקבוקים לחביות`;', 'return `מיכל ${tankLabel}: פיצול לימים שונים מותר רק בין בקבוקים לחביות`;', 1)
          s = s.replace('return `מיכל ${t.number}: ניתן לפצל לכל היותר לשני ימי אריזה`;', 'return `מיכל ${tankLabel}: ניתן לפצל לכל היותר לשני ימי אריזה`;', 1)

          old = '''    const cycleLiters = linkedBrew?.liters ?? t.liters;\n    if (used.get(cycleKey)! > cycleLiters + 0.01)\n      return `מיכל ${t.number}: הכמות המתוכננת גדולה מהנפח הזמין במחזור`;\n    if (r.emptyTank && cycleLiters - used.get(cycleKey)! >= 20)\n      return `מיכל ${t.number}: לא ניתן לסמן סיום — נשארת כמות שניתנת לאריזה מהמחזור`;'''
          new = '''    const cycleLiters = linkedBrew?.liters ?? t?.liters ?? 0;\n    if (!cycleLiters) return `מיכל ${tankLabel}: חסר נפח מחזור לחישוב האריזה`;\n    if (used.get(cycleKey)! > cycleLiters + 0.01)\n      return `מיכל ${tankLabel}: הכמות המתוכננת גדולה מהנפח הזמין במחזור`;\n    if (r.emptyTank && cycleLiters - used.get(cycleKey)! >= 20)\n      return `מיכל ${tankLabel}: לא ניתן לסמן סיום — נשארת כמות שניתנת לאריזה מהמחזור`;'''
          if old not in s:
              raise SystemExit('canonical packaging liters anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/planning/PlanningBrewAssignmentEditor.tsx src/SERVICES/planning/productionCycle.ts
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix pending brew relink and future packaging identity'
          git push origin HEAD:planning-tank-schedule
