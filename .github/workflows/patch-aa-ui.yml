name: Patch aa UI

on:
  push:
    branches:
      - feature/shipment-aa-appsscript-deploy
    paths:
      - ".github/workflows/patch-aa-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/shipment-aa-appsscript-deploy
      - name: Apply aa UI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          quick = Path('src/components/dashboard/QuickTankReportBox.tsx')
          text = quick.read_text()
          text = text.replace('import { useState } from "react";', 'import { useEffect, useState } from "react";')
          anchor = '    const isSending = status === "sending";\n\n'
          effect = '''    const isSending = status === "sending";\n\n    useEffect(() => {\n        if (noteType !== "דרייהופ" || !specs || dryHopAa !== "") return;\n\n        const category = getDryHopStyleCategory(tank.beerStyle);\n        const calc = calcDryHopDose(category, tank.beerVolume);\n        if (calc.needsManualInput || !calc.hopType) return;\n\n        const defaultAa = getHopAa(calc.hopType, specs);\n        if (defaultAa !== null) setDryHopAa(String(defaultAa));\n    }, [noteType, specs, dryHopAa, tank.beerStyle, tank.beerVolume]);\n\n'''
          if effect not in text:
              if anchor not in text:
                  raise SystemExit('QuickTankReportBox anchor not found')
              text = text.replace(anchor, effect, 1)
          quick.write_text(text)

          app = Path('src/App.tsx')
          text = app.read_text()
          text = text.replace(
              'import { getSpecsFromFb, type SpecChart } from "./SERVICES/getAndPost/getSpecsFromFb";',
              'import { type SpecChart } from "./SERVICES/getAndPost/getSpecsFromFb";'
          )
          old = '''    useEffect(() => {\n        async function loadSpecs() {\n            try {\n                setSpecs(await getSpecsFromFb());\n            } catch (error) {\n                console.error("Failed to load specs:", error);\n            }\n        }\n        loadSpecs();\n    }, []);'''
          new = '''    useEffect(() => {\n        const specsRef = collection(db, "specs");\n        const unsubscribe = onSnapshot(\n            specsRef,\n            (snapshot) => {\n                const nextSpecs: SpecChart = {};\n                snapshot.docs.forEach((firebaseDoc) => {\n                    nextSpecs[firebaseDoc.id] = firebaseDoc.data() as Record<string, number>;\n                });\n                setSpecs(nextSpecs);\n            },\n            (error) => {\n                console.error("Failed to subscribe to specs:", error);\n            }\n        );\n        return unsubscribe;\n    }, []);'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('App specs effect anchor not found')
          app.write_text(text)

          css = Path('src/App.css')
          text = css.read_text()
          rule = '''\n/* Compact aa inputs in dry-hop reports */\n.quickReportForm input[placeholder="aa"],\n.note-RowsBox input[placeholder="aa"] {\n  width: 86px !important;\n  max-width: 86px !important;\n  min-width: 86px !important;\n  flex: 0 0 86px !important;\n}\n'''
          if '/* Compact aa inputs in dry-hop reports */' not in text:
              text += rule
          css.write_text(text)
          PY
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/App.css src/components/dashboard/QuickTankReportBox.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Keep specs live and prefill dry-hop aa"
          git push origin HEAD:feature/shipment-aa-appsscript-deploy
