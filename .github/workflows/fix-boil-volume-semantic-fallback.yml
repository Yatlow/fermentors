name: Fix boil volume semantic fallback

on:
  push:
    branches:
      - fix/boil-volume-semantic-fallback

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boil-volume-semantic-fallback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/brewing/BrewFormStepper.tsx')
          s = p.read_text()
          old = '''  function sugarSheetRow(key: string, fallbackOffset: number): number {\n    return sheetRowFromMeta(\n      `__sheetRow.sugar.${key}`,\n      baseRow + fallbackOffset,\n    );\n  }\n'''
          new = '''  async function sugarSheetRow(\n    key: string,\n    fallbackOffset: number,\n  ): Promise<number> {\n    const metaRow = Number(fields[`__sheetRow.sugar.${key}`]);\n    if (Number.isFinite(metaRow) && metaRow > 0) return metaRow;\n\n    const semanticPatterns: Record<string, RegExp> = {\n      frPlato: /^F\\.R\\.?\\s*$/i,\n      lrPlato: /^L\\.R\\.?\\s*$/i,\n      kettlePlato: /^סיר בישול/i,\n      kettleVolume: /^סיר בישול/i,\n      endBoilPlato: /^סוף רתיחה$/i,\n      endBoilVolume: /^סוף רתיחה$/i,\n      fermentorSamplePlato: /^תחילת תסיסה$/i,\n      cumulativeTankVolume: /^תחילת תסיסה$/i,\n    };\n    const pattern = semanticPatterns[key];\n\n    if (run.sheetId && pattern) {\n      try {\n        // Do not depend on the background full-Sheet reconciliation having\n        // finished before the brewer clicks the calculator. A narrow read is\n        // safe while the form is active and lets us resolve the visible label\n        // to its real Sheet row on variable templates.\n        const rows = await readBrewSheetRange(\n          run.sheetId,\n          \"'גיליון1'!A1:C220\",\n        );\n        const rowIndex = rows.findIndex((row) =>\n          pattern.test(String(row[0] ?? \"\").trim()),\n        );\n        if (rowIndex >= 0) return rowIndex + 1;\n      } catch (error) {\n        console.warn(\"Failed resolving semantic sugar row\", { key, error });\n      }\n    }\n\n    return baseRow + fallbackOffset;\n  }\n'''
          if old not in s:
              raise SystemExit('sugarSheetRow block not found')
          s = s.replace(old, new, 1)

          old2 = '''    const parsed = num(value);\n    const writes: Array<{\n      range: string;\n      value: string | number | boolean | null;\n    }> = [\n      {\n        range: `'גיליון1'!${column}${sugarSheetRow(\n          key,\n          rowOffset,\n        )}`,\n        value: parsed === null ? \"\" : parsed,\n      },\n    ];\n'''
          new2 = '''    const parsed = num(value);\n    const targetSheetRow = await sugarSheetRow(key, rowOffset);\n    const writes: Array<{\n      range: string;\n      value: string | number | boolean | null;\n    }> = [\n      {\n        range: `'גיליון1'!${column}${targetSheetRow}`,\n        value: parsed === null ? \"\" : parsed,\n      },\n    ];\n'''
          if old2 not in s:
              raise SystemExit('commitSugar write block not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/brewing/BrewFormStepper.tsx
          git commit -m "Resolve brew volume Sheet rows before writes"
          git push origin HEAD:fix/boil-volume-semantic-fallback
