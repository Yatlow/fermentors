name: Fix PR119 packaging canonical identity and batch sequence
on:
  push:
    branches: [planning-tank-schedule]
    paths: ['.github/workflows/pr119-fix-packaging-canonical-and-sequence.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Sequence: prior planned weeks drive the next forecast number.
          # Real/pending batches reserve numbers but unrelated higher historical
          # numbers must not create holes such as skipping 1607.
          p = Path('src/components/planning/PlanningBrewAssignmentEditor.tsx')
          s = p.read_text()
          old = '''  const [batchBase, setBatchBase] = useState(() => Math.max(\n    maxBatch(brews.map((brew) => brew.batchNumber)),\n    maxBatch(priorPlannedBatches),\n  ));'''
          new = '''  const [batchBase, setBatchBase] = useState(() => {\n    const priorBase = maxBatch(priorPlannedBatches);\n    return priorBase > 0 ? priorBase : maxBatch(brews.map((brew) => brew.batchNumber));\n  });'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''        setBatchBase(Math.max(\n          maxBatch(history.map((brew) => brew.batchNumber)),\n          maxBatch(pending.map((brew) => brew.batchNumber)),\n          maxBatch(brews.map((brew) => brew.batchNumber)),\n          maxBatch(priorPlannedBatches),\n        ));'''
          new = '''        const priorBase = maxBatch(priorPlannedBatches);\n        setBatchBase(priorBase > 0\n          ? priorBase\n          : Math.max(\n              maxBatch(history.map((brew) => brew.batchNumber)),\n              maxBatch(pending.map((brew) => brew.batchNumber)),\n              maxBatch(brews.map((brew) => brew.batchNumber)),\n            ));'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)

          # 2) Repair canonical packaging identity at the UI save boundary, not
          # inside the global resolver. Only the packaging row the user actually
          # edits is eligible, and only when tank + style + date resolve to a
          # unique latest planned cycle. This preserves the safety invariant that
          # arbitrary legacy tank-only rows never bind to a future brew.
          p = Path('src/components/planning/PlanningBoard.tsx')
          s = p.read_text()
          s = s.replace(
            'import { resolvePackagingBrewId } from "../../SERVICES/planning/planIdentity";',
            'import { resolvePackagingBrewId, type PackagingPlan } from "../../SERVICES/planning/planIdentity";',
            1,
          )
          anchor = '''  async function persist(next: WeekPlan, confirmBrews = false) {\n    if (weekIsClosed(next.id, today)) throw new Error("השבוע נסגר לתכנון בתחילת יום שישי.");\n    const packagingWasEdited = JSON.stringify(next.packaging) !== JSON.stringify(current.packaging);'''
          replacement = '''  function attachCanonicalBrewToEditedPackaging(next: WeekPlan): WeekPlan {\n    const allForMatch = [...plans.filter((w) => w.id !== next.id), next];\n    return {\n      ...next,\n      packaging: next.packaging.map((run) => {\n        const saved = current.packaging.find((item) => item.id === run.id);\n        const wasEdited = JSON.stringify(saved ?? null) !== JSON.stringify(run);\n        if (!wasEdited || resolvePackagingBrewId(run as PackagingPlan, allForMatch)) return run;\n        if (!run.tankId || !run.date) return run;\n        const product = settings.products.find((item) => item.id === run.productId);\n        const style = run.nonInventoryStyle ?? product?.style;\n        if (!style) return run;\n        const candidates = allForMatch\n          .flatMap((week) => week.brews ?? [])\n          .filter((brew) => brew.tankId === run.tankId && brew.date <= run.date && sameStyle(brew.style, style))\n          .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));\n        const brew = candidates.at(-1);\n        if (!brew) return run;\n        return {\n          ...run,\n          brewId: brew.id,\n          tankId: brew.tankId,\n          ...(brew.batchNumber ? { batchNumber: brew.batchNumber } : {}),\n        };\n      }),\n    };\n  }\n\n  async function persist(next: WeekPlan, confirmBrews = false) {\n    if (weekIsClosed(next.id, today)) throw new Error("השבוע נסגר לתכנון בתחילת יום שישי.");\n    next = attachCanonicalBrewToEditedPackaging(next);\n    const packagingWasEdited = JSON.stringify(next.packaging) !== JSON.stringify(current.packaging);'''
          if anchor not in s:
              raise SystemExit('PlanningBoard persist anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/planning/PlanningBrewAssignmentEditor.tsx src/components/planning/PlanningBoard.tsx
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix contiguous batch sequence and packaging brew identity'
          git push origin HEAD:planning-tank-schedule
