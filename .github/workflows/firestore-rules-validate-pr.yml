name: Validate Firestore Rules PR

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "scripts/test-firestore-planning-rules.mjs"
      - ".github/workflows/firestore-rules-validate-pr.yml"

concurrency:
  group: firestore-rules-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate_rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install rules test helper
        run: npm install --no-save --ignore-scripts @firebase/rules-unit-testing

      - name: Compile and exercise Firestore planning rules
        run: >-
          npx --yes firebase-tools emulators:exec
          --only firestore
          --project demo-fermentors
          "node scripts/test-firestore-planning-rules.mjs"
