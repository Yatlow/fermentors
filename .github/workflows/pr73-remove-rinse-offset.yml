name: PR73 remove legacy rinse offsets

on:
  push:
    branches:
      - fix/firestore-brew-write-loop

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firestore-brew-write-loop
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove fixed-offset rinse parser
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/brewing/BrewFormStepper.tsx')
          text = path.read_text()
          old = '''  for (let index = 1; index <= 7; index += 1) {
    const rowOffset = 18 + (index - 1);
    const time = normalizedTime(cell(rowOffset, "E"));
    const amount = numericText(cell(rowOffset, "F"));
    const temp = numericText(cell(rowOffset, "G"));
    const volumeText = cell(rowOffset, "H");

    if (time) pulled[`rinse${index}.time`] = time;
    if (amount) pulled[`rinse${index}.amount`] = amount;
    if (temp) pulled[`rinse${index}.temp`] = temp;

    if (volumeText) {
      const parts = volumeText
        .split("+")
        .map((part) => numericText(part))
        .filter(Boolean);
      if (parts[0]) pulled[`rinse${index}.kettle`] = parts[0];
      if (usesGrant && parts[1]) {
        pulled[`rinse${index}.grant`] = parts[1];
      }
    }
  }

'''
          if old not in text:
              raise SystemExit('Expected legacy rinse offset block not found')
          replacement = '''  // Rinse rows are template-dependent (for example Wheat has a third mash rest),
  // so never infer them from fixed offsets. They are parsed only from their
  // explicit visible labels ("שטיפה 1", "שטיפה 2", ... ) below.

'''
          path.write_text(text.replace(old, replacement, 1))
          PY
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/brewing/BrewFormStepper.tsx
          git commit -m "Remove fixed rinse row offsets from brew parser"
          git push origin HEAD:fix/firestore-brew-write-loop
