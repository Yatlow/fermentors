name: PR73 remove legacy rinse offsets

on:
  push:
    branches: [fix/firestore-brew-write-loop]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/firestore-brew-write-loop
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/patch-pr73-rinse.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/brewing/BrewFormStepper.tsx
          git commit -m "Remove fixed rinse row offsets from brew parser"
          git push origin HEAD:fix/firestore-brew-write-loop
