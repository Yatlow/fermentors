name: Fix PR119 contiguous batch sequence
on:
  push:
    branches: [planning-tank-schedule]
    paths: ['.github/workflows/pr119-batch-sequence-contiguous.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply contiguous planning batch sequence fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/planning/PlanningBrewAssignmentEditor.tsx')
          s = p.read_text()

          old = '''  const [batchBase, setBatchBase] = useState(() => Math.max(\n    maxBatch(brews.map((brew) => brew.batchNumber)),\n    maxBatch(priorPlannedBatches),\n  ));'''
          new = '''  const [batchBase, setBatchBase] = useState(() => {\n    const priorBase = maxBatch(priorPlannedBatches);\n    return priorBase > 0 ? priorBase : maxBatch(brews.map((brew) => brew.batchNumber));\n  });'''
          if old not in s:
              raise SystemExit('batchBase init anchor not found')
          s = s.replace(old, new, 1)

          old = '''        setBatchBase(Math.max(\n          maxBatch(history.map((brew) => brew.batchNumber)),\n          maxBatch(pending.map((brew) => brew.batchNumber)),\n          maxBatch(brews.map((brew) => brew.batchNumber)),\n          maxBatch(priorPlannedBatches),\n        ));'''
          new = '''        const priorBase = maxBatch(priorPlannedBatches);\n        setBatchBase(priorBase > 0\n          ? priorBase\n          : Math.max(\n              maxBatch(history.map((brew) => brew.batchNumber)),\n              maxBatch(pending.map((brew) => brew.batchNumber)),\n              maxBatch(brews.map((brew) => brew.batchNumber)),\n            ));'''
          if old not in s:
              raise SystemExit('batchBase effect anchor not found')
          s = s.replace(old, new, 1)

          # Once planning has a prior week, that prior plan controls the sequence.
          # Real/pending brews still reserve their exact numbers below, so manual
          # brewer-created batches cannot collide, but an unrelated higher real
          # batch no longer pushes every later planning week forward.
          old = '''      brews\n        .filter((source) => Number(source.action) === 0)\n        .map((source) => Number(normalizedBatch(source.batchNumber)))'''
          new = '''      brews\n        .filter((source) => Number(source.action) === 0 || Number(source.action) === 1)\n        .map((source) => Number(normalizedBatch(source.batchNumber)))'''
          if old not in s:
              raise SystemExit('reserved live batch anchor not found')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/planning/PlanningBrewAssignmentEditor.tsx
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Keep planned batch sequence contiguous across weeks'
          git push origin HEAD:planning-tank-schedule
