name: Deploy Apps Script now

on:
  push:
    branches:
      - feature/shipment-aa-appsscript-deploy
    paths:
      - ".github/workflows/deploy-apps-script-now.yml"

permissions:
  contents: read

concurrency:
  group: apps-script-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Push and update production Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Restore clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Validate Apps Script project
        run: |
          test -f .clasp.json
          test -f appsscript.json
          node --check post.js
          node --check addFermentationMeasurement.js

      - name: Push Apps Script sources
        run: clasp push --force

      - name: Update production Web App deployment
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: AKfycbzSq8vnL_P9DOkiXluKReSUNFILqlRkK-WxnPC_Q0BNt23rFHbLpRlkvPudbqElqw5h
        run: |
          clasp deploy \
            --deploymentId "$APPS_SCRIPT_DEPLOYMENT_ID" \
            --description "Manual production deploy ${GITHUB_SHA::7}"

      - name: Verify deployment still exists
        env:
          APPS_SCRIPT_DEPLOYMENT_ID: AKfycbzSq8vnL_P9DOkiXluKReSUNFILqlRkK-WxnPC_Q0BNt23rFHbLpRlkvPudbqElqw5h
        run: |
          DEPLOYMENTS="$(clasp deployments)"
          printf '%s\n' "$DEPLOYMENTS"
          printf '%s\n' "$DEPLOYMENTS" | grep -F "$APPS_SCRIPT_DEPLOYMENT_ID"
