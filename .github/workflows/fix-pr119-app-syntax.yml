name: Fix PR119 App syntax
on:
  push:
    branches: [planning-tank-schedule]
    paths: ['.github/workflows/fix-pr119-app-syntax.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-tank-schedule
      - name: Fix syntax and verify
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          bad = 'setNewReadings((prev) => ({ ...prev, [tankId]: { ...prev[tankId], [field]: value }));'
          good = 'setNewReadings((prev) => ({ ...prev, [tankId]: { ...prev[tankId], [field]: value } }));'
          assert s.count(bad) == 1, f'expected one broken expression, found {s.count(bad)}'
          p.write_text(s.replace(bad, good, 1))
          PY
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Fix App reading state syntax'
          git push origin HEAD:planning-tank-schedule
