name: Apply wheat pH and pending brew edit fix

on:
  push:
    branches:
      - fix/wheat-ph-pending-brew-edit
    paths:
      - .github/workflows/apply-wheat-ph-pending-edit.yml
      - .github/scripts/apply_wheat_ph_pending_edit.py

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wheat-ph-pending-brew-edit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply brewing fixes
        run: python3 .github/scripts/apply_wheat_ph_pending_edit.py
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node .github/scripts/validate-apps-script-runtime.mjs
      - name: Commit tested fix
        shell: bash
        run: |
          rm .github/workflows/apply-wheat-ph-pending-edit.yml
          rm .github/scripts/apply_wheat_ph_pending_edit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/BREWING_SHEET_SERVICE.js src/components/brewing/BrewingView.tsx .github/workflows/apply-wheat-ph-pending-edit.yml .github/scripts/apply_wheat_ph_pending_edit.py
          git diff --cached --check
          git commit -m 'Fix Wheat pH label and pending brew editing'
          git push origin HEAD:fix/wheat-ph-pending-brew-edit
