name: One-off measurement persistent cache optimization

on:
  push:
    branches:
      - planning-read-audit-preview
    paths:
      - '.github/workflows/oneoff-measurement-persistent-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: planning-read-audit-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply measurement cache patch
        run: python scripts/patch-measurement-persistent-cache.py
      - name: Verify
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit product change and clean helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-measurement-persistent-cache.yml scripts/patch-measurement-persistent-cache.py
          git add src/SERVICES/getAndPost/gettAllDataByBatch.ts
          git commit -m 'Reuse revision-safe persistent measurement cache'
          git push origin HEAD:planning-read-audit-preview
