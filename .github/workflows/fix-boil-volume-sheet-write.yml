name: Fix boil volume Sheet row

on:
  push:
    branches:
      - fix/boil-volume-sheet-write

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boil-volume-sheet-write
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/brewing/BrewFormStepper.tsx')
          s = p.read_text()
          old = '''    pulled[`__sheetRow.sugar.${key}`] = String(\n      sheetStartRow + rowIndex,\n    );\n    const plato = numericText(dynamicValue(rowIndex, \"B\"));\n'''
          new = '''    const sheetRow = String(sheetStartRow + rowIndex);\n    pulled[`__sheetRow.sugar.${key}`] = sheetRow;\n    // Volume values live in column C of the same semantic sugar row. Keep\n    // explicit row aliases for their field keys so writes never fall back to\n    // IPA fixed offsets on variable templates.\n    if (key === \"kettlePlato\") pulled[\"__sheetRow.sugar.kettleVolume\"] = sheetRow;\n    if (key === \"endBoilPlato\") pulled[\"__sheetRow.sugar.endBoilVolume\"] = sheetRow;\n    if (key === \"fermentorSamplePlato\") pulled[\"__sheetRow.sugar.cumulativeTankVolume\"] = sheetRow;\n    const plato = numericText(dynamicValue(rowIndex, \"B\"));\n'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/brewing/BrewFormStepper.tsx
          git commit -m "Fix semantic Sheet rows for brew volumes"
          git push origin HEAD:fix/boil-volume-sheet-write
