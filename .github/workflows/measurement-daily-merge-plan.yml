name: Plan Daily Measurement Merge (Read Only)
on:
  workflow_dispatch:
    inputs:
      batches:
        description: "Up to 10 comma-separated batch numbers. Full measurement backup, no writes."
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: measurement-daily-merge-plan
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FERMENTER_DASHBOARD_BADA3 }}
      - name: Local safety tests
        run: node scripts/plan-daily-measurement-merge.mjs --self-test
      - name: Generate full backup and oldest-wins dry run
        env:
          FIREBASE_PROJECT_ID: fermenter-dashboard-bada3
          BATCHES: ${{ inputs.batches }}
        run: |
          set -euo pipefail
          node scripts/plan-daily-measurement-merge.mjs --batches "$BATCHES" > daily-measurement-plan.json
          node --input-type=module <<'JS'
          import fs from "node:fs";
          const r=JSON.parse(fs.readFileSync("daily-measurement-plan.json","utf8"));
          const groups=r.results.flatMap(b=>b.dailyPlans);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "## Daily measurement merge preview (READ ONLY)\n\n" +
            "- Batches: "+r.batches.join(", ")+"\n"+
            "- Firestore measurement reads: "+r.documentsRead+"\n"+
            "- Multiple-measurement days: "+groups.length+"\n"+
            "- Days needing value review: "+groups.filter(g=>g.differingFields.length).length+"\n"+
            "- Creation-time ambiguities: "+groups.filter(g=>!g.allCreationTimesValidAndDistinct).length+"\n"+
            "- Firestore writes/deletes: **0**\n\n"+
            "Artifact contains a **full copy of measurement documents** for the selected batches. Handle privately.\n");
          JS
      - name: Upload private short-lived full backup and dry run
        uses: actions/upload-artifact@v4
        with:
          name: daily-measurement-plan-${{ github.run_number }}
          path: daily-measurement-plan.json
          retention-days: 3
