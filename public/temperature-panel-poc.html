<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temperature Panel PoC</title><style>body{font-family:system-ui;background:#0b1020;color:white;margin:0}.w{max-width:760px;margin:auto;padding:16px}.card{background:#151c30;border-radius:18px;padding:14px;margin:12px 0}img,canvas{max-width:100%;border-radius:12px}label{display:block;background:#4d7cff;padding:14px;text-align:center;border-radius:12px;font-weight:700}input{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.t{background:#26324f;padding:8px;border-radius:10px;text-align:center}.v{font-size:20px;font-weight:800}.bad{color:#ff8b94}small{color:#9eabc8}</style></head><body><div class=w><h1>צילום כל הטמפרטורות — PoC</h1><div class=card><label>📷 צלם / בחר תמונת לוח<input id=f type=file accept="image/*" capture=environment></label><canvas id=c></canvas></div><div class=card><div id=g class=grid></div></div><small>מיפוי ראשוני לפי צילום הייחוס. קורא רק PV אדום. אין כתיבה ל‑Firestore.</small></div><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const rois={2:[.735,.271,.085,.057],3:[.875,.271,.085,.057],4:[.598,.340,.085,.057],5:[.735,.340,.085,.057],6:[.875,.340,.085,.057],7:[.735,.440,.085,.057],8:[.875,.440,.085,.057],9:[.055,.303,.082,.055],10:[.154,.303,.082,.055],11:[.255,.303,.082,.055],12:[.055,.352,.082,.055],13:[.154,.352,.082,.055],14:[.255,.352,.082,.055],15:[.055,.408,.082,.055],16:[.154,.408,.082,.055],17:[.255,.408,.082,.055],18:[.154,.463,.082,.055],19:[.255,.463,.082,.055]};const f=document.querySelector('#f'),c=document.querySelector('#c'),x=c.getContext('2d'),g=document.querySelector('#g');function show(vals={}){g.innerHTML=Object.keys(rois).map(n=>'<div class=t>מיכל '+n+'<div class=v>'+(vals[n]??'…')+'</div></div>').join('')}show();
f.onchange=e=>{let q=e.target.files[0];if(!q)return;let im=new Image;im.onload=()=>run(im);im.src=URL.createObjectURL(q)};
async function run(im){c.width=im.naturalWidth;c.height=im.naturalHeight;x.drawImage(im,0,0);let vals={};show(vals);for(const [n,r] of Object.entries(rois)){const [rx,ry,rw,rh]=r,X=rx*c.width,Y=ry*c.height,W=rw*c.width,H=rh*c.height;x.strokeStyle='#ffe04d';x.lineWidth=Math.max(2,c.width/350);x.strokeRect(X,Y,W,H);x.fillStyle='#ffe04d';x.font=Math.max(14,c.width/35)+'px system-ui';x.fillText(n,X+3,Y+18);const t=document.createElement('canvas');t.width=Math.max(180,W*4);t.height=Math.max(100,H*4);const z=t.getContext('2d');z.filter='contrast(180%) saturate(140%)';z.drawImage(im,X,Y,W,H,0,0,t.width,t.height);try{const o=await Tesseract.recognize(t,'eng',{logger:()=>{}}),s=(o.data.text||'').replace(/[^0-9.\-]/g,'');const m=s.match(/-?\d{1,2}(?:\.\d)?/);vals[n]=m?m[0]+'°':'?'}catch{vals[n]='?'}show(vals)}}</script></body></html>
