<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gauge Reader PoC</title>
<style>body{font-family:system-ui;margin:0;background:#0b1020;color:#fff}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#151c30;border:1px solid #2b3654;border-radius:20px;padding:16px;margin:12px 0}.view{position:relative;aspect-ratio:3/4;background:#000;border-radius:18px;overflow:hidden}video,.freeze{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.freeze{display:none}canvas#c{display:none}.guide{position:absolute;width:70%;aspect-ratio:1/1;left:50%;top:50%;transform:translate(-50%,-50%);border:4px solid #e7b52c;border-radius:50%;box-shadow:0 0 0 999px #0006;pointer-events:none;box-sizing:border-box}.guide.ok{border-color:#3ddc84}button,.file{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:14px;margin:9px 0;font-size:17px;font-weight:700;text-align:center;background:#4d7cff;color:white}.file{background:#26324f}input{display:none}.result{font-size:44px;font-weight:800;text-align:center}.meta{line-height:1.8;color:#cbd4eb}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#26324f;margin:3px}.warn{color:#ffd56a}.oktxt{color:#6ce5a3}.bad{color:#ff7a86}small{color:#94a2c4}</style></head><body><div class="wrap"><h1>מד לחץ — PoC</h1><div class="card"><div class="view"><video id="v" autoplay playsinline muted></video><canvas id="freeze" class="freeze"></canvas><canvas id="c"></canvas><div id="g" class="guide"></div></div><div id="hint" class="warn">מקם את כל פני השעון בתוך העיגול</div><button id="cam">פתח מצלמה</button><button id="manual" type="button">צלם ובדוק כעת (גם בלי ירוק)</button></div><div class="card"><details open><summary>Debug</summary><pre id="debug" style="white-space:pre-wrap;direction:ltr;text-align:left;font-size:12px;color:#9eabc8"></pre></details></div><div class="card"><div id="res" class="result">—</div><div id="meta" class="meta">עדיין אין קריאה.</div></div><small>PoC בלבד. אינו שומר נתונים ואינו מחובר ל‑Firestore. זיהוי הסקאלה אוטומטי; אם אינו בטוח, הקריאה נדחית.</small></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const v=document.querySelector('#v'),freeze=document.querySelector('#freeze'),fz=freeze.getContext('2d'),c=document.querySelector('#c'),ctx=c.getContext('2d',{willReadFrequently:true}),debug=document.querySelector('#debug'),res=document.querySelector('#res'),meta=document.querySelector('#meta'),hint=document.querySelector('#hint'),guide=document.querySelector('#g');let stream,autoTimer,lastAuto=0,stable=0,capturing=false;
async function openCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;await v.play();cam.style.display='none';hint.textContent='יישר את המצלמה מול השעון';log('camera opened '+v.videoWidth+'x'+v.videoHeight);startAuto()}catch(e){cam.style.display='block';cam.textContent='הפעל מצלמה';hint.textContent='Safari דורש אישור מצלמה';log('camera error: '+e.message)}}cam.onclick=openCamera;document.querySelector('#manual').onclick=()=>{if(!v.videoWidth||capturing)return;log('MANUAL capture requested; quality checks remain active');captureBurst()};function log(m){debug.textContent+=new Date().toLocaleTimeString()+' '+m+'\n';debug.scrollTop=debug.scrollHeight}openCamera();
function startAuto(){clearInterval(autoTimer);autoTimer=setInterval(()=>{if(!v.videoWidth||Date.now()-lastAuto<7000)return;drawSource(v);const q=quickQuality();guide.classList.toggle('ok',q.ok);hint.textContent=q.ok?'יציב… מצלם אוטומטית':(q.ellipse.ratio<.78?'יישר את הטלפון בניצב למד':'יישר את השעון בתוך העיגול והחזק יציב');if(stable===0)log('quality sharp='+q.sharp.toFixed(1)+' edge='+q.edgeScore.toFixed(1)+' ellipseRatio='+q.ellipse.ratio.toFixed(3)+' '+(q.ok?'PASS':'FAIL'));stable=q.ok?stable+1:0;if(stable>=3&&!capturing){stable=0;lastAuto=Date.now();captureBurst()}},350)}function quickQuality(){const d=grayData(),W=c.width,H=c.height,sharp=laplaceLike(d,W,H),cx=W/2,cy=H/2;let edge=0,n=0;for(let deg=0;deg<360;deg+=4){const a=deg*Math.PI/180;for(const rr of [.31,.34,.37,.40]){const X=Math.round(cx+Math.cos(a)*W*rr),Y=Math.round(cy+Math.sin(a)*H*rr);if(X>1&&Y>1&&X<W-1&&Y<H-1){const i=Y*W+X;edge+=Math.abs(d[i]-d[i+1])+Math.abs(d[i]-d[i+W]);n+=2}}}const ellipse=estimateEllipse(d,W,H);const edgeScore=edge/Math.max(1,n),ok=sharp>3.5&&edgeScore>5&&ellipse.ratio>=.78;return{ok,sharp,edgeScore,ellipse}}
function estimateEllipse(d,W,H){const cx=W/2,cy=H/2,rs=[];for(let deg=0;deg<360;deg+=5){const a=deg*Math.PI/180;let best={v:0,r:0};for(let r=W*.27;r<W*.44;r+=2){const x=Math.round(cx+Math.cos(a)*r),y=Math.round(cy+Math.sin(a)*r),i=y*W+x;if(x<2||y<2||x>=W-2||y>=H-2)continue;const v=Math.abs(d[i]-d[i+1])+Math.abs(d[i]-d[i+W]);if(v>best.v)best={v,r}}rs.push({a,r:best.r})}const horiz=rs.filter(p=>Math.abs(Math.sin(p.a))<.35).map(p=>p.r),vert=rs.filter(p=>Math.abs(Math.cos(p.a))<.35).map(p=>p.r),med=a=>{a.sort((x,y)=>x-y);return a[Math.floor(a.length/2)]||0},rx=med(horiz),ry=med(vert),ratio=Math.min(rx,ry)/Math.max(1,Math.max(rx,ry));return{ratio,centerOffset:0}}
function drawSource(src){const W=900,H=900;c.width=W;c.height=H;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const sw=src.videoWidth||src.naturalWidth,sh=src.videoHeight||src.naturalHeight,s=Math.min(sw,sh),sx=(sw-s)/2,sy=(sh-s)/2;ctx.drawImage(src,sx,sy,s,s,0,0,W,H)}
function grayData(){const im=ctx.getImageData(0,0,c.width,c.height),d=im.data,g=new Uint8Array(c.width*c.height);for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=d[i]*.299+d[i+1]*.587+d[i+2]*.114;return g}
function estimateNeedle(g,W,H){const nominal={x:W/2,y:H/2};function darkness(x,y){x=Math.round(x);y=Math.round(y);return x>=0&&y>=0&&x<W&&y<H?(255-g[y*W+x])/255:0}function hubScore(cx,cy){let s=0,n=0;for(let y=-W*.035;y<=W*.035;y+=3)for(let x=-W*.035;x<=W*.035;x+=3){if(x*x+y*y<=W*W*.0012){s+=darkness(cx+x,cy+y);n++}}return s/Math.max(1,n)}let hub={x:nominal.x,y:nominal.y,score:-1};for(let dy=-W*.055;dy<=W*.055;dy+=4)for(let dx=-W*.055;dx<=W*.055;dx+=4){const q=hubScore(nominal.x+dx,nominal.y+dy);if(q>hub.score)hub={x:nominal.x+dx,y:nominal.y+dy,score:q}}function ray(deg,r1,r2,halfWidth=2){const a=deg*Math.PI/180;let sum=0,n=0;for(let r=W*r1;r<W*r2;r+=2){let cross=0,N=0;for(let q=-halfWidth;q<=halfWidth;q++){const x=hub.x+Math.cos(a)*r-Math.sin(a)*q,y=hub.y+Math.sin(a)*r+Math.cos(a)*q;cross+=darkness(x,y);N++}sum+=cross/Math.max(1,N);n++}return sum/Math.max(1,n)}function continuity(deg){const a=deg*Math.PI/180;let good=0,total=0,longest=0,run=0;for(let r=W*.055;r<W*.355;r+=3){let v=0;for(let q=-2;q<=2;q++)v+=darkness(hub.x+Math.cos(a)*r-Math.sin(a)*q,hub.y+Math.sin(a)*r+Math.cos(a)*q);v/=5;const ok=v>.22;total++;if(ok){good++;run++;longest=Math.max(longest,run)}else run=0}return{fraction:good/total,longest:longest/total}}const axes=[];for(let deg=0;deg<180;deg+=.5){const near=(ray(deg,.055,.19,3)+ray(deg+180,.055,.19,3))/2;axes.push({deg,near})}axes.sort((x,y)=>y.near-x.near);const shortlist=[];for(const q of axes){if(shortlist.every(p=>Math.abs(p.deg-q.deg)>4)&&shortlist.length<8)shortlist.push(q)}let candidates=[];for(const ax of shortlist)for(const deg of [ax.deg,(ax.deg+180)%360]){const cont=continuity(deg),mid=ray(deg,.10,.27,2),outer=ray(deg,.27,.355,2),score=cont.fraction*.40+cont.longest*.25+mid*.20+outer*.15;candidates.push({deg,score,cont,mid,outer,axis:ax.deg})}candidates.sort((x,y)=>y.score-x.score);const chosen=candidates[0],runner=candidates[1],ratio=chosen.score/Math.max(.001,runner.score);return{a:chosen.deg,score:chosen.score,forward:chosen.outer,opposite:runner.outer,axis:chosen.axis,sideRatio:ratio,sideConfidence:Math.min(1,(ratio-1)/.25),ambiguous:ratio<1.08||chosen.cont.fraction<.42,hubX:hub.x,hubY:hub.y,hubScore:hub.score,continuity:chosen.cont.fraction,runnerAngle:runner.deg,runnerScore:runner.score}}
function pressureFromAngle(deg,max){const start=135,sweep=270;let a=deg;while(a<start)a+=360;const f=(a-start)/sweep;if(f<-.03||f>1.03)return null;return Math.max(0,Math.min(max,f*max))}
async function detectScale(){hint.textContent='מזהה את הסקאלה…';const gd=grayData(),W=c.width,H=c.height,cx=W/2,cy=H/2;function ringPeaks(r1,r2){const vals=[];for(let deg=0;deg<360;deg+=.5){const a=deg*Math.PI/180;let dark=0,n=0;for(let r=W*r1;r<W*r2;r+=3){const X=Math.round(cx+Math.cos(a)*r),Y=Math.round(cy+Math.sin(a)*r);if(X>=0&&Y>=0&&X<W&&Y<H){dark+=(255-gd[Y*W+X])/255;n++}}vals.push({deg,v:dark/Math.max(1,n)})}const peaks=[];for(let i=2;i<vals.length-2;i++)if(vals[i].v>vals[i-1].v&&vals[i].v>vals[i+1].v&&vals[i].v>.18)peaks.push(vals[i]);return peaks}const peaks=ringPeaks(.32,.39);log('tick peaks='+peaks.length);const candidates=[];for(const max of [2.5,4,6]){const major=max===2.5?5:max,step=270/major;let score=0,n=0;for(let k=0;k<=major;k++){const target=(135+k*step)%360;let best=0;for(const p of peaks){let d=Math.abs(p.deg-target);d=Math.min(d,360-d);if(d<5)best=Math.max(best,p.v)}if(best){score+=best;n++}}candidates.push({max,score:score/Math.max(1,n),hits:n})}candidates.sort((a,b)=>b.hits-a.hits||b.score-a.score);log('scale geometry='+JSON.stringify(candidates));const best=candidates[0],second=candidates[1];const close=second&&best.hits-second.hits<=1&&Math.abs(best.score-second.score)<.08;if(close){log('scale ambiguous: '+best.max+' vs '+second.max);return null}if(best.hits>=Math.max(4,(best.max===6?5:4))){return{max:best.max,label:'0–'+best.max+' bar',evidence:'major tick geometry'}}return null}
function laplaceLike(g,W,H){let s=0,n=0;for(let y=2;y<H-2;y+=4)for(let x=2;x<W-2;x+=4){const i=y*W+x,v=Math.abs(4*g[i]-g[i-1]-g[i+1]-g[i-W]-g[i+W]);s+=v;n++}return s/n}
async function captureBurst(){capturing=true;clearInterval(autoTimer);drawSource(v);freeze.width=c.width;freeze.height=c.height;fz.drawImage(c,0,0);freeze.style.display='block';v.style.display='none';try{navigator.vibrate?.(60)}catch{}log('CAPTURE frozen after 3 green frames');hint.textContent='נקלט — מנתח את הפריים הקפוא…';const gd=grayData(),needle=estimateNeedle(gd,c.width,c.height),sharp=laplaceLike(gd,c.width,c.height);log('sharp='+sharp.toFixed(1)+' needleAngle='+needle.a.toFixed(2)+' needleScore='+needle.score.toFixed(3)+' hub=('+needle.hubX.toFixed(0)+','+needle.hubY.toFixed(0)+') hubScore='+needle.hubScore.toFixed(2)+' continuity='+needle.continuity.toFixed(2)+' runner='+needle.runnerAngle.toFixed(1)+' runnerScore='+needle.runnerScore.toFixed(3)+' sideRatio='+needle.sideRatio.toFixed(2)+' '+(needle.ambiguous?'AMBIGUOUS':'PASS'));const scale=await detectScale();log('scale='+(scale?scale.label:'NOT DETECTED'));if(!scale){res.textContent='לא נקרא';meta.innerHTML='<span class="bad">✕ הסקאלה לא זוהתה בביטחון.</span>';capturing=false;return}const p=pressureFromAngle(needle.a,scale.max);log('pressure='+(p==null?'null':p.toFixed(3))+' bar');if(p==null||needle.score<=.24||sharp<=3.5||needle.ambiguous){res.textContent='לא נקרא';meta.innerHTML='<span class="bad">✕ המחוג לא זוהה בכיוון חד־משמעי.</span>';capturing=false;return}res.textContent=p.toFixed(2)+' bar';meta.innerHTML='<span class="oktxt">✓ נותח הפריים שנקלט</span><br><span class="pill">סקאלה: '+scale.label+'</span><span class="pill">זווית: '+needle.a.toFixed(1)+'°</span>';hint.textContent='הקריאה הושלמה';capturing=false}
async function analyzeImage(src){res.textContent='…';meta.innerHTML='מנתח יישור, סקאלה ומחוג…';drawSource(src);const g=grayData(),W=c.width,H=c.height,needle=estimateNeedle(g,W,H),scale=await detectScale(),sharp=laplaceLike(g,W,H),quality=needle.score>.24&&sharp>3.5;guide.classList.toggle('ok',quality&&!!scale);if(!scale){res.textContent='לא נקרא';meta.innerHTML='<span class="bad">✕ הסקאלה לא זוהתה בביטחון.</span><br>צלם שוב כשהמספרים והיחידה bar גלויים.';return}const p=pressureFromAngle(needle.a,scale.max);if(p==null||!quality||needle.ambiguous){res.textContent='לא נקרא';meta.innerHTML='<span class="bad">✕ איכות/יישור לא מספיקים.</span><br><span class="pill">'+scale.label+'</span> <span class="pill">חדות '+sharp.toFixed(0)+'</span>';return}res.textContent=p.toFixed(2)+' bar';meta.innerHTML='<span class="oktxt">✓ צילום התקבל</span><br><span class="pill">סקאלה: '+scale.label+'</span><span class="pill">זווית: '+needle.a.toFixed(1)+'°</span><span class="pill">חדות: '+sharp.toFixed(0)+'</span><br>זיהוי סקאלה: '+scale.evidence+'. <b>יש לאמת מול קריאה ידנית.</b>'}
</script></body></html>
