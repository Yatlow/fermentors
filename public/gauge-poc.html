<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gauge Reader PoC</title>
<style>body{font-family:system-ui;margin:0;background:#0b1020;color:#fff}.wrap{max-width:560px;margin:auto;padding:18px}.card{background:#151c30;border:1px solid #2b3654;border-radius:20px;padding:16px;margin:12px 0}.view{position:relative;aspect-ratio:3/4;background:#000;border-radius:18px;overflow:hidden}video,canvas{width:100%;height:100%;object-fit:cover}.guide{position:absolute;width:70%;aspect-ratio:1/1;left:50%;top:50%;transform:translate(-50%,-50%);border:4px solid #e7b52c;border-radius:50%;box-shadow:0 0 0 999px #0006;pointer-events:none;box-sizing:border-box}.guide.ok{border-color:#3ddc84}button,.file{display:block;width:100%;box-sizing:border-box;border:0;border-radius:14px;padding:14px;margin:9px 0;font-size:17px;font-weight:700;text-align:center;background:#4d7cff;color:white}.file{background:#26324f}input{display:none}.result{font-size:44px;font-weight:800;text-align:center}.meta{line-height:1.8;color:#cbd4eb}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#26324f;margin:3px}.warn{color:#ffd56a}.oktxt{color:#6ce5a3}.bad{color:#ff7a86}small{color:#94a2c4}</style></head><body><div class="wrap"><h1>מד לחץ — PoC</h1><div class="card"><div class="view"><video id="v" autoplay playsinline></video><canvas id="c" hidden></canvas><div id="g" class="guide"></div></div><div id="hint" class="warn">מקם את כל פני השעון בתוך העיגול</div><button id="cam">פתח מצלמה</button></div><div class="card"><div id="res" class="result">—</div><div id="meta" class="meta">עדיין אין קריאה.</div></div><small>PoC בלבד. אינו שומר נתונים ואינו מחובר ל‑Firestore. זיהוי הסקאלה אוטומטי; אם אינו בטוח, הקריאה נדחית.</small></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const v=document.querySelector('#v'),c=document.querySelector('#c'),ctx=c.getContext('2d',{willReadFrequently:true}),res=document.querySelector('#res'),meta=document.querySelector('#meta'),hint=document.querySelector('#hint'),guide=document.querySelector('#g');let stream,autoTimer,lastAuto=0,stable=0,capturing=false;
cam.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=stream;hint.textContent='יישר את המצלמה מול השעון — הצילום יתבצע אוטומטית';startAuto();}catch(e){hint.textContent='לא ניתן לפתוח מצלמה: '+e.message}};
shot.onclick=()=>{if(v.videoWidth)analyzeImage(v)};function startAuto(){clearInterval(autoTimer);autoTimer=setInterval(()=>{if(!v.videoWidth||Date.now()-lastAuto<7000)return;drawSource(v);const q=quickQuality();guide.classList.toggle('ok',q.ok);hint.textContent=q.ok?'יציב… מצלם אוטומטית':'יישר את השעון בתוך העיגול והחזק יציב';stable=q.ok?stable+1:0;if(stable>=3&&!capturing){stable=0;lastAuto=Date.now();captureBurst()}},350)}function quickQuality(){const d=grayData(),W=c.width,H=c.height,sharp=laplaceLike(d,W,H);let edge=0,n=0;const cx=W/2,cy=H/2;for(let deg=0;deg<360;deg+=4){const a=deg*Math.PI/180;for(const rr of [.31,.34,.37,.40]){const X=Math.round(cx+Math.cos(a)*W*rr),Y=Math.round(cy+Math.sin(a)*H*rr);if(X>1&&Y>1&&X<W-1&&Y<H-1){const i=Y*W+X;edge+=Math.abs(d[i]-d[i+1])+Math.abs(d[i]-d[i+W]);n+=2}}}return{ok:sharp>14&&edge/Math.max(1,n)>8}};file.onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>analyzeImage(im);im.src=URL.createObjectURL(f)};
function drawSource(src){const W=900,H=900;c.width=W;c.height=H;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const sw=src.videoWidth||src.naturalWidth,sh=src.videoHeight||src.naturalHeight,s=Math.min(sw,sh),sx=(sw-s)/2,sy=(sh-s)/2;ctx.drawImage(src,sx,sy,s,s,0,0,W,H)}
function grayData(){const im=ctx.getImageData(0,0,c.width,c.height),d=im.data,g=new Uint8Array(c.width*c.height);for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=d[i]*.299+d[i+1]*.587+d[i+2]*.114;return g}
function estimateNeedle(g,W,H){const cx=W/2,cy=H/2;let best={score:-1,a:0};for(let deg=0;deg<360;deg+=.25){const a=deg*Math.PI/180;let score=0,n=0;for(let r=W*.10;r<W*.38;r+=3){const x=Math.round(cx+Math.cos(a)*r),y=Math.round(cy+Math.sin(a)*r);if(x<0||y<0||x>=W||y>=H)continue;score+=(255-g[y*W+x])/255;n++}score/=Math.max(1,n);if(score>best.score)best={score,a:deg}}return best}
function pressureFromAngle(deg,max){const start=135,sweep=270;let a=deg;while(a<start)a+=360;const f=(a-start)/sweep;if(f<-.03||f>1.03)return null;return Math.max(0,Math.min(max,f*max))}
async function detectScale(){try{hint.textContent='מזהה את הסקאלה…';const d=document.createElement('canvas'),z=d.getContext('2d');d.width=700;d.height=700;const q=c.width*.15;z.drawImage(c,q,q,c.width-q*2,c.height-q*2,0,0,700,700);z.filter='grayscale(100%) contrast(180%)';z.drawImage(d,0,0);const out=await Promise.race([Tesseract.recognize(d,'eng',{logger:()=>{}}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('ocr timeout')),6500))]),t=(out.data.text||'').replace(/,/g,'.'),nums=[...t.matchAll(/\b\d+(?:\.\d+)?\b/g)].map(m=>Number(m[0])),low=t.toLowerCase();if(nums.some(n=>Math.abs(n-2.5)<.06))return{max:2.5,label:'0–2.5 bar',evidence:'2.5'};if(/psi/.test(low)&&nums.some(n=>n>=50))return{max:4,label:'0–4 bar / PSI',evidence:'PSI + 50/60'};if(nums.includes(6)||([0,1,2,3,4,5].filter(n=>nums.includes(n)).length>=4&&nums.some(n=>n>=5)))return{max:6,label:'0–6 bar',evidence:'0–6'};if(nums.includes(4)&&nums.includes(3)&&nums.includes(2))return{max:4,label:'0–4 bar',evidence:'0–4'};return null}catch(e){hint.textContent='זיהוי הסקאלה נכשל — נסה שוב';return null}}
function laplaceLike(g,W,H){let s=0,n=0;for(let y=2;y<H-2;y+=4)for(let x=2;x<W-2;x+=4){const i=y*W+x,v=Math.abs(4*g[i]-g[i-1]-g[i+1]-g[i-W]-g[i+W]);s+=v;n++}return s/n}
async function captureBurst(){capturing=true;hint.textContent='ירוק — אוסף 9 פריימים לייצוב…';const readings=[];for(let k=0;k<9;k++){drawSource(v);const gd=grayData(),needle=estimateNeedle(gd,c.width,c.height),sharp=laplaceLike(gd,c.width,c.height);if(needle.score>.28&&sharp>14)readings.push({a:needle.a,score:needle.score,sharp});await new Promise(r=>setTimeout(r,90))}if(readings.length<5){capturing=false;guide.classList.remove('ok');hint.textContent='הצילום זז בזמן הקריאה — נסה שוב';return}const scale=await detectScale();if(!scale){res.textContent='לא נקרא';meta.innerHTML='<span class="bad">✕ הסקאלה לא זוהתה בביטחון.</span>';capturing=false;return}const ps=readings.map(q=>pressureFromAngle(q.a,scale.max)).filter(q=>q!=null).sort((a,b)=>a-b);if(ps.length<5){capturing=false;return}const med=ps[Math.floor(ps.length/2)],mad=[...ps].map(q=>Math.abs(q-med)).sort((a,b)=>a-b)[Math.floor(ps.length/2)];if(mad>scale.max*.015){res.textContent='לא נקרא';meta.innerHTML='<span class="bad">✕ המחוג לא היה יציב מספיק.</span><br>פיזור '+mad.toFixed(3)+' bar';capturing=false;return}res.textContent=med.toFixed(2)+' bar';meta.innerHTML='<span class="oktxt">✓ קריאה מיוצבת מ-'+ps.length+' פריימים</span><br><span class="pill">סקאלה: '+scale.label+'</span><span class="pill">פיזור: '+mad.toFixed(3)+' bar</span><br><b>Median אחרי סינון פריימים לא יציבים.</b>';hint.textContent='הקריאה הושלמה';capturing=false}
async function analyzeImage(src){res.textContent='…';meta.innerHTML='מנתח יישור, סקאלה ומחוג…';drawSource(src);const g=grayData(),W=c.width,H=c.height,needle=estimateNeedle(g,W,H),scale=await detectScale(),sharp=laplaceLike(g,W,H),quality=needle.score>.28&&sharp>14;guide.classList.toggle('ok',quality&&!!scale);if(!scale){res.textContent='לא נקרא';meta.innerHTML='<span class="bad">✕ הסקאלה לא זוהתה בביטחון.</span><br>צלם שוב כשהמספרים והיחידה bar גלויים.';return}const p=pressureFromAngle(needle.a,scale.max);if(p==null||!quality){res.textContent='לא נקרא';meta.innerHTML='<span class="bad">✕ איכות/יישור לא מספיקים.</span><br><span class="pill">'+scale.label+'</span> <span class="pill">חדות '+sharp.toFixed(0)+'</span>';return}res.textContent=p.toFixed(2)+' bar';meta.innerHTML='<span class="oktxt">✓ צילום התקבל</span><br><span class="pill">סקאלה: '+scale.label+'</span><span class="pill">זווית: '+needle.a.toFixed(1)+'°</span><span class="pill">חדות: '+sharp.toFixed(0)+'</span><br>זיהוי סקאלה: '+scale.evidence+'. <b>יש לאמת מול קריאה ידנית.</b>'}
</script></body></html>
